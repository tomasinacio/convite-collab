/* ====================================================================================== */
:root{
  --paper:#F6EFDF; --sand:#E6D6B8; --ink:#3B2F25; --olive:#4F5F2E; --terracotta:#9A4C32;
  --brown:#6B4F34; --twine:#B8946A; --clay:#C98B6B; --lemon:#EBDDA0;
  --shade:#E3E2D6; --warm-ink:#4A3B2E;
  /* azulejo tokens, sampled from the user's 7 examples (AZ tokens); tile art only */
  --az-ink:#1B2556; --az-cobalt:#344680; --az-glaze:#F3EEE5;
  --script:'Allura', cursive;
  --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
  /* one curve family [AN][EM]: ease-out for entrances, the house ease-in-out for hinges and on-screen travel (CC 1.8),
     a near-linear glaze for light and pigment (CC 4.8: light and opacity changes take linear) */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-fold:cubic-bezier(.77,0,.175,1); --ease-glaze:cubic-bezier(.33,.1,.5,1);
  --ease-sine:cubic-bezier(.37,0,.63,1);   /* v13: every ambient loop, infinite alternate (easeInOutSine) */
  /* brown shadows, one light top left, 1:2 offsets (CC 1.5, 1.6, 6.4) */
  --lie:0 1px 1.5px rgb(107 79 52 / .2), 1px 2px 4px rgb(107 79 52 / .07), 2px 4px 8px rgb(107 79 52 / .06), 4px 8px 16px rgb(107 79 52 / .06), 8px 16px 32px rgb(107 79 52 / .05);
  /* sheet geometry (opening round 2): S one screen; W sheet width; one tall sheet from the width: Hm middle, Ht top flap,
     Hb bottom flap, whose free edges meet under the seal; P where the closed packet sits (centred); top where the open
     sheet sits (68 px down, clear of Skip); D slides the closed packet to P */
  --S:100vh;
  --W:min(calc(100vw - 32px), 400px);
  --Hm:calc(var(--W) * 1.4);
  --Ht:clamp(120px, calc(var(--W) * .42), 168px);
  --Hb:calc(var(--Hm) - var(--Ht));
  --P:max(72px, calc((var(--S) - var(--Hm)) / 2));
  --top:max(68px, calc(var(--P) - var(--Ht)));
  --D:calc(var(--P) - var(--Ht) - var(--top));
  --sy:calc(var(--Ht) * 2);   /* the seal sits on the top flap's free edge */
  --seal:100px;               /* seal image box (the wax is about 80 px); any seal that keeps the v9_bake.py contract fits */
  --hh:.63;                   /* seal half height over --seal */
  --k:1;                      /* face layout scale; ?sharp=1 sets 3 (see .face) */
  /* opening beats, ms from the tap: press and crack snappy, the two fold turns calm, top first then bottom */
  /* the bottom flap starts as the top one passes upright, so the lower seal half is never left alone on bare paper */
  --t-lift:160ms; --d-lift:1300ms; --t-drop:840ms; --d-drop:1360ms;   /* fully open at 2.2 s */
  --ease-io:cubic-bezier(.45,.05,.25,1);   /* the v9 fold curve */
  /* world geometry: u = 1% of the painted column (phone width, capped at 440 px); y0 = the names panel's bottom edge.
     Screen 1 hangs from S; everything below hangs from y0 in u, so every overlap holds on every phone. */
  --u:calc(min(100vw, 440px) / 100);
  --panel-top:calc(var(--S) * .41);
  --y0:calc(var(--panel-top) + var(--u) * 50.42);
  --world-h:calc(var(--y0) + var(--u) * 326);   /* v12: +34u for the dogs; v13: the lower page 18u tighter, the foot 32u closer */
  --G:calc(var(--y0) + var(--u) * 158);         /* v13: the gate-box top (was y0 + 176u) */
  color-scheme:light;
}
@supports (height:100svh){ :root{ --S:100svh; } }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--shade)}
body{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink);background:var(--shade);overflow-x:clip}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.paper{background:var(--paper) var(--img-paper) 0 0 / 341px repeat}

/* Skip: first in focus order, visible from load to the end of the reveal (10 s); [WG] motion over 5 s needs a stop */
.skip{position:fixed;top:max(12px, env(safe-area-inset-top));right:12px;z-index:30;min-height:44px;padding:0 18px;border:1px solid var(--twine);border-radius:999px;
  background:var(--paper);font-size:16px;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.skip.out{opacity:0;pointer-events:none}
.skip[hidden],html:not(.js) .skip{display:none}
/* hover is colour only and only on real pointers; press is a 160 ms scale .97 [EM][WG] */
@media (hover:hover) and (pointer:fine){.skip:hover,.again:hover{background:var(--sand)}}
.skip,.again{transition:opacity .2s linear, scale .16s var(--ease-out)}
.skip:active,.again:active{scale:.97}

/* ---------- page: one screen while closed, then the painted world ---------- */
.page{position:relative;display:flow-root} /* flow-root: the sheet's top margin must not pull the world down */
.js .page:not(.opened){height:var(--S);overflow:hidden}
.page.opened{min-height:var(--world-h)}
/* no script: no letter to open, the finished painted page shows at rest */
html:not(.js) .sheet{display:none}
html:not(.js) .page{min-height:var(--world-h)}

/* =============== THE SHEET (opening round 2, from prototype.v9.html): closed letter, wax seal, two vertical folds =============== */
/* ms from the tap: 0-100 press; 0 the whole seal swaps to two halves (the crack), they part 1 px in 180 ms; 60-420 twine ends
   slip and drop as the twine and label fade; 160-1460 top flap lifts with the sheet sliding to its open place; 840-2200 bottom
   flap drops; fully open at 2.2 s. Hand-over (v11): the world comes up 1.7-2.5 s, while the bottom flap is about 70% down,
   and the sheet dissolves 2.2-2.9 s. */
.sheet{position:relative;z-index:2;width:var(--W);margin:var(--top) auto 0;height:calc(var(--Ht) + var(--Hm) + var(--Hb))}
.sheet.is-open{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s linear 2.2s, visibility 0s linear 2.9s}
.move{position:absolute;left:0;right:0;top:0;height:100%;transform:translateY(var(--D));transition:transform var(--d-lift) var(--ease-io) var(--t-lift)}
.is-open .move{transform:none}
/* the folds sit in their own box: 1600 px perspective reads as paper, and the box clips them to the sheet's width */
.folds{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 50%;overflow-x:clip}
.pnl{position:absolute;left:0;width:100%}
/* paper faces seen at the hand-over carry the world's paper tile in the world's phase, so the dissolve shows no step */
.mid{top:var(--Ht);height:var(--Hm);background-position:calc((var(--W) - 100vw) / 2) calc((var(--top) + var(--Ht)) * -1)}
.tp{top:0;height:var(--Ht);transform-origin:50% 100%;transform-style:preserve-3d;transform:rotateX(-180deg);transition:transform var(--d-lift) var(--ease-io) var(--t-lift)}
.bt{top:calc(var(--Ht) + var(--Hm));height:var(--Hb);transform-origin:50% 0;transform-style:preserve-3d;transform:rotateX(180deg);
  transition:transform var(--d-drop) var(--ease-io) var(--t-drop)}
.is-open .tp,.is-open .bt{transform:none}
.move,.tp,.bt{will-change:transform}
/* each face is laid out at --k times its size and scaled back. Chromium rasterises a layer turning in perspective at one texel
   per CSS px (pixelated while it moves on a DPR 3 phone); --k:3 fixes that but cost frames in CPU-throttled emulation, so 1
   is the default and ?sharp=1 tries 3 on a real phone. Lengths inside a face are times --k. */
.sharp{--k:3}
.face{position:absolute;left:0;top:0;width:calc(100% * var(--k));height:calc(100% * var(--k));transform-origin:0 0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:scale(calc(1 / var(--k))) translateZ(.3px)}
.face-out{transform:translateY(calc(100% / var(--k))) rotateX(180deg) scale(calc(1 / var(--k))) translateZ(.3px)}
.tp .face-in{background-position:calc((var(--W) - 100vw) / 2 * var(--k)) calc(var(--top) * -1 * var(--k))}
.bt .face-in{background-position:calc((var(--W) - 100vw) / 2 * var(--k)) calc((var(--top) + var(--Ht) + var(--Hm)) * -1 * var(--k))}
.tp:not(.ride) .face-out{background:var(--img-closed-top) 0 0 / 100% 100% no-repeat}
.bt:not(.ride) .face-out{background:var(--img-closed-bottom) 0 0 / 100% 100% no-repeat}
.face.paper{background-size:calc(341px * var(--k))}
.instant,.instant *{transition:none !important}
.ride{pointer-events:none}
/* a crease is a soft valley, not a rule */
.crease{position:absolute;left:1%;right:1%;top:0;height:6px;margin-top:-3px;pointer-events:none;
  background:linear-gradient(rgb(107 79 52 / 0),rgb(107 79 52 / .07) 45%,rgb(255 253 247 / .3) 58%,rgb(255 253 247 / 0))}
.face .crease{height:calc(6px * var(--k));margin-top:calc(-3px * var(--k))}
/* the flap's sky is the world sky, cut to the flap: same file, same size, same offset, so the hand-over is seamless.
   The open flap sits at (sheet left, --top) on the page; the world's sky at (stage left - 8u, -3u). */
/* v11: it also carries the world's wash and its second, paler cloud run (.sky-b at .2), in the world's own geometry, so the
   two skies match when the world comes up around the sheet */
.flap-sky{--wx:calc((var(--W) - 100vw) / 2 * var(--k));--wy:calc(var(--top) * -1 * var(--k));position:absolute;inset:0;overflow:hidden;
  background:
    var(--img-sky) calc(((var(--W) - var(--u) * 100) / 2 - var(--u) * 8) * var(--k)) calc((var(--top) * -1 - var(--u) * 3) * var(--k)) / calc(var(--u) * 116 * var(--k)) auto no-repeat,
    radial-gradient(90% 45% at 0% 0%, rgb(235 221 160 / .22), rgb(235 221 160 / 0) 70%) var(--wx) var(--wy) / calc(100vw * var(--k)) calc(var(--world-h) * var(--k)) no-repeat,
    linear-gradient(rgb(151 170 189 / .10), rgb(151 170 189 / 0) calc(var(--S) * .55 * var(--k)), rgb(230 214 184 / 0) 50%, rgb(230 214 184 / .2)) var(--wx) var(--wy) / calc(100vw * var(--k)) calc(var(--world-h) * var(--k)) no-repeat}
.flap-sky i{position:absolute;left:calc(((var(--W) - var(--u) * 100) / 2 - var(--u) * 14) * var(--k));top:calc((var(--top) * -1 - var(--u) * 8) * var(--k));
  width:calc(var(--u) * 124 * var(--k));aspect-ratio:1100/733;background:var(--img-sky-b) 0 0 / 100% 100% no-repeat;transform:scaleX(-1);opacity:.2}

/* resting shadows on the table, one light top left: static, the fold ones fade in as each flap lands (opacity only) */
.ground{position:absolute;left:0;right:0;box-shadow:var(--lie)}
.g-mid{top:var(--Ht);height:var(--Hm)}
.g-top{top:3px;height:calc(var(--Ht) - 3px);opacity:0}
.g-bot{top:calc(var(--Ht) + var(--Hm));height:calc(var(--Hb) - 3px);opacity:0}
.is-open .g-top{opacity:1;transition:opacity 300ms var(--ease-out) calc(var(--t-lift) + var(--d-lift) * .7)}
.is-open .g-bot{opacity:1;transition:opacity 250ms var(--ease-out) calc(var(--t-drop) + var(--d-drop) * .7)}
/* a flap's free edge casts a thin shadow on the paper under it */
.cast{position:absolute;left:0;right:0;height:calc(10px * var(--k))}
.tp .cast{top:calc(100% - 1px * var(--k));background:linear-gradient(rgb(107 79 52 / .2),rgb(107 79 52 / 0))}
.bt .cast{bottom:calc(100% - 3px * var(--k));background:linear-gradient(rgb(107 79 52 / 0),rgb(107 79 52 / .14))}
/* live shading: one gradient layer per face, opacity only; hinge shadow on the middle */
.shade{position:absolute;inset:0;opacity:0;pointer-events:none}
.tp .face-in .shade{background:linear-gradient(to top,rgb(59 47 37),rgb(59 47 37 / .4))}
.tp .face-out .shade{background:linear-gradient(to bottom,rgb(59 47 37),rgb(59 47 37 / .4))}
.bt .face-in .shade{background:linear-gradient(to bottom,rgb(59 47 37),rgb(59 47 37 / .4))}
.bt .face-out .shade{background:linear-gradient(to top,rgb(59 47 37),rgb(59 47 37 / .4))}
@keyframes fold-shade{0%{opacity:0}50%{opacity:.14}100%{opacity:0}}
@keyframes hinge{0%{opacity:0}40%{opacity:.2}100%{opacity:0}}
.is-open .tp .shade{animation:fold-shade var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .bt .shade{animation:fold-shade var(--d-drop) var(--ease-io) var(--t-drop) both}
.hinge{position:absolute;left:0;right:0;height:26px;opacity:0;pointer-events:none}
.h-top{top:0;background:linear-gradient(rgb(59 47 37),rgb(59 47 37 / 0))}
.h-bot{bottom:0;background:linear-gradient(rgb(59 47 37 / 0),rgb(59 47 37))}
.is-open .h-top{animation:hinge var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .h-bot{animation:hinge var(--d-drop) var(--ease-io) var(--t-drop) both}
/* a soft sheen crosses each face as it turns: paper catching the window light, not a flat board */
.gl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gl i{position:absolute;left:0;right:0;top:0;height:60%;opacity:0;transform:translateY(-100%);
  background:linear-gradient(rgb(255 252 242 / 0),rgb(255 252 242 / .38) 50%,rgb(255 252 242 / 0))}
@keyframes sheen{0%{opacity:0;transform:translateY(-100%)}40%{opacity:1}100%{opacity:0;transform:translateY(170%)}}
.is-open .tp .gl i{animation:sheen var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .bt .gl i{animation:sheen var(--d-drop) var(--ease-io) var(--t-drop) both}

/* the user's twine and pressed sprig (P3), in two halves: at the crack each loses the part under the wax at once (so nothing
   lies over the halves), then its cut end slips out and drops a few px as it fades */
.closed-deco{position:absolute;left:0;width:100%;aspect-ratio:1083/540;top:calc(var(--sy) - var(--W) * .2493);pointer-events:none}
.deco{position:absolute;inset:0;background:var(--img-closed-deco) 0 0 / 100% 100% no-repeat}
.deco-l{clip-path:inset(0 50% 0 0);transform-origin:0 50%}
.deco-r{clip-path:inset(0 0 0 50%);transform-origin:100% 50%}
.crack .deco{opacity:0;transition:opacity .36s var(--ease-out) .06s,transform .38s var(--ease-out)}
.crack .deco-l{clip-path:inset(0 calc(50% + var(--seal) * .52) 0 0);transform:translateX(-4px) rotate(1.4deg)}
.crack .deco-r{clip-path:inset(0 0 0 calc(50% + var(--seal) * .52));transform:translateX(4px) rotate(-1.2deg)}
/* idle light: one pre-rendered band, <= .12 alpha, 3 s, every 7 s, from 2.5 s; gone on touch (CC 6.8) [CH] attention loop */
.light{position:absolute;left:0;right:0;top:var(--Ht);height:var(--Hm);overflow:hidden;pointer-events:none;z-index:6}
.light i{position:absolute;top:0;bottom:0;left:0;width:55%;opacity:0;
  background:linear-gradient(105deg, rgb(255 251 240 / 0) 20%, rgb(255 251 240 / .12) 50%, rgb(255 251 240 / 0) 80%)}
.light.on i{animation:sweep 7s linear infinite}
@keyframes sweep{0%{opacity:1;transform:translateX(-100%)}43%{opacity:1;transform:translateX(190%)}43.1%,100%{opacity:0;transform:translateX(190%)}}
.is-open .light{display:none}
/* the seal: the only call to act, a real button, 44 px+ target, label below, no pulse (CC 6.10); press scale .97 in 100 ms [EM] */
.seal{position:absolute;left:50%;top:calc(var(--sy) - var(--seal) / 2);translate:-50% 0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0 10px 4px;border:0;border-radius:14px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seal:disabled{cursor:default;pointer-events:none}
.wax{display:block;width:var(--seal);height:var(--seal);background:var(--img-seal) 0 0 / 100% 100% no-repeat;transition:scale .1s var(--ease-out)}
.seal:active .wax,.pressed .wax{scale:.97}
.seal-label{font-style:italic;font-size:18px;line-height:1.2;color:var(--ink);padding:0 6px;margin-top:calc(var(--seal) * -.05)}
.crack .wax{opacity:0}
.crack .seal-label{opacity:0;transition:opacity 200ms var(--ease-out)}
/* the halves, cut from the same photo, sit exactly under it; the tap swaps them in (the crack) and they part. They ride
   copies of the two flaps drawn above both papers, so wax that crosses the seam is never covered by the other flap.
   The upper half lifts 1 px and tips .4deg about the right end of the break; under it the lower half carries the dark
   inside of the break, so the hairline gap never shows paper. */
.half{--s:calc(var(--seal) * var(--k));position:absolute;left:calc(50% - var(--s) / 2);width:var(--s);height:calc(var(--s) * var(--hh));display:block;
  opacity:0;transform:scale(.97);background:0 0 / 100% 100% no-repeat}
.half-up{background-image:var(--img-seal-top);top:calc(100% - var(--s) / 2);transform-origin:50% calc(var(--s) / 2)}
.half-lo{background-image:var(--img-seal-bottom);top:calc((var(--Ht) - var(--Hm) + var(--Hb)) * var(--k) + var(--s) * (.5 - var(--hh)));
  transform-origin:50% calc(var(--s) * (var(--hh) - .5))}
.crack .half{opacity:1}
.crack .half-up{transform:translate(calc(var(--s) * .38),calc(-1px * var(--k))) rotate(-.4deg) translateX(calc(var(--s) * -.38));transition:transform 180ms var(--ease-out)}
.crack .half-lo{transform:none;transition:transform 180ms var(--ease-out)}

/* =============== THE WORLD: one full-bleed painted page (IR B.1 to B.9) =============== */
/* one continuous wash under everything (IR B.2): sky tint at the top, haze, straw ground at the foot; one warm light from
   the top left (IR B.4). 0 KB: gradients over the one paper tile. */
.world{position:absolute;left:0;top:0;width:100%;height:var(--world-h);z-index:1;overflow:hidden;
  background:
    radial-gradient(90% 45% at 0% 0%, rgb(235 221 160 / .22), rgb(235 221 160 / 0) 70%),
    linear-gradient(rgb(151 170 189 / .10), rgb(151 170 189 / 0) calc(var(--S) * .55), rgb(230 214 184 / 0) 50%, rgb(230 214 184 / .2)),
    var(--paper) var(--img-paper) 0 0 / 341px repeat}
.js .world{opacity:0}
.opened .world{opacity:1;transition:opacity .8s var(--ease-glaze) 1.7s}
/* the painted column: phone width, centred on wider screens; its art bleeds past it */
.stage{position:absolute;top:0;bottom:0;left:50%;width:calc(var(--u) * 100);margin-left:calc(var(--u) * -50)}
.art{position:absolute;display:block;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
/* grass roots dissolve into the ground over the last ~20% (painted edges fade, IR B.6): one static gradient mask, never animated */
.root-fade{-webkit-mask-image:linear-gradient(to top, transparent, #000 22%);mask-image:linear-gradient(to top, transparent, #000 22%)}

/* ---- screen 1 (v13): every piece that loops on two rhythms is a box (one loop) holding an image .in (the other loop) ---- */
.in{position:absolute;inset:0;display:block;background-size:100% 100%;background-repeat:no-repeat}
.sky{left:calc(var(--u) * -8);top:calc(var(--u) * -3);width:calc(var(--u) * 116);aspect-ratio:1100/733}
.sky > .in{background-image:var(--img-sky)}
.sky-b-wrap{position:absolute;left:calc(var(--u) * -14);top:calc(var(--u) * -8);width:calc(var(--u) * 124);aspect-ratio:1100/733;opacity:.2}
.sky-b{left:0;top:0;width:100%;height:100%;background-image:var(--img-sky-b);transform:scaleX(-1)}
/* two cloud veils (C1 far, C2 low behind the panel). Until the Copilot clouds arrive they are cut from sky-b's warm cloud
   masses under a soft, static elliptical mask (the adviser's fallback) */
.c1{left:calc(var(--u) * 26);top:calc(var(--u) * 2);width:calc(var(--u) * 48);aspect-ratio:3/1;opacity:.55}
/* C2 starts right of 74u: further left, the round cloud's ink outline sat behind the opening line (3.1:1, measured) */
.c2{left:calc(var(--u) * 74);top:calc(var(--panel-top) - var(--u) * 22);width:calc(var(--u) * 56);aspect-ratio:3/1;opacity:.6}
.c1 > .in,.c2 > .in{background-image:var(--img-sky-b);
  -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent);mask-image:radial-gradient(closest-side, #000 30%, transparent)}
.c1 > .in{background-size:250% auto;background-position:8.3% 10%}
.c2 > .in{background-size:263% auto;background-position:100% 17.3%;transform:scaleX(-1)}
[data-art~="cloud-long"] .c1{aspect-ratio:600/280}
[data-art~="cloud-round"] .c2{aspect-ratio:600/283}
[data-art~="cloud-long"] .c1 > .in{background:var(--img-cloud-long) 0 0 / 100% 100% no-repeat;-webkit-mask-image:none;mask-image:none}
[data-art~="cloud-round"] .c2 > .in{background:var(--img-cloud-round) 0 0 / 100% 100% no-repeat;-webkit-mask-image:none;mask-image:none;transform:none}
/* the olive twice: B (the same art turned 38deg) behind A, so the corner reads as one tree, not one sticker */
.olive{left:calc(var(--u) * -7);top:calc(var(--u) * -3);width:calc(var(--u) * 58);aspect-ratio:1100/1098;transform-origin:0 0}
.olive > .in{background-image:var(--img-olive);transform-origin:35% 30%}
.olive-b{left:calc(var(--u) * -4);top:calc(var(--u) * -6);width:calc(var(--u) * 36);aspect-ratio:1100/1098;transform-origin:0 0;transform:rotate(38deg)}
.olive-b > .in{background-image:var(--img-olive);transform-origin:0 0}
/* with the new art, olive B is a long twig hanging straight down at the left edge, behind the olive, its cut end at the
   top; its lower half shows below the olive's leaves (further right it was hidden by them) */
[data-art~="olive-twig-trailing"] .olive-b{left:calc(var(--u) * .5);top:calc(var(--u) * -2);width:calc(var(--u) * 12);aspect-ratio:102/360;
  transform:none;transform-origin:50% 0}
[data-art~="olive-twig-trailing"] .olive-b > .in{background-image:var(--img-olive-twig);transform-origin:50% 0}
/* one loose olive leaf falls down the left margin (x 1 to 11u, never over the opening line or the panel): three slow
   swings that tilt with the fall, then it fades into the grass; first at 12 s, then every 52 s */
.leaf{display:none;left:calc(var(--u) * 6);top:calc(var(--u) * 12);width:calc(var(--u) * 3.4);aspect-ratio:46/120;background-image:var(--img-olive-leaf);opacity:0}
[data-art~="olive-leaf"] .leaf{display:block}
@keyframes leaf{
  0%{opacity:0;translate:0 0;rotate:-10deg}
  1%{opacity:1}
  2.4%{translate:calc(var(--u) * 3) calc((var(--y0) - var(--u) * 40) * .17);rotate:25deg}
  4.8%{translate:calc(var(--u) * -3) calc((var(--y0) - var(--u) * 40) * .34);rotate:-25deg}
  7.2%{translate:calc(var(--u) * 3) calc((var(--y0) - var(--u) * 40) * .51);rotate:22deg}
  9.6%{translate:calc(var(--u) * -2) calc((var(--y0) - var(--u) * 40) * .68);rotate:-18deg}
  12%{opacity:1;translate:calc(var(--u) * 1.5) calc((var(--y0) - var(--u) * 40) * .86);rotate:10deg}
  14.4%,100%{opacity:0;translate:0 calc(var(--y0) - var(--u) * 40);rotate:0deg}}
.js .go .leaf{animation:leaf 52s var(--ease-sine) 12s infinite}
.bird{aspect-ratio:1100/799;background-image:var(--img-swallow)}
.bird.t1{left:calc(var(--u) * 44);top:calc(var(--S) * .17);width:calc(var(--u) * 8.5);rotate:-6deg}
.bird.t2{left:calc(var(--u) * 55);top:calc(var(--S) * .23);width:calc(var(--u) * 5);rotate:10deg}
/* the two birds over the land: a box drifts sideways, the bird inside rises, falls and tilts on another rhythm */
.soar{aspect-ratio:1100/799}
.soar.s3{left:calc(var(--u) * 58);top:calc(var(--y0) + var(--u) * 105);width:calc(var(--u) * 5.5)}
.soar.s4{left:calc(var(--u) * 66);top:calc(var(--y0) + var(--u) * 109);width:calc(var(--u) * 3.6)}
.soar > .in{background-image:var(--img-swallow);transform:scaleX(-1)}
.bird.t5{left:calc(var(--u) * 24);top:calc(var(--y0) + var(--u) * 146);width:calc(var(--u) * 5);rotate:-8deg}
/* a second pose (seen from below) for some of the small birds, so five swallows are not one sticker */
[data-art~="swallow-below"] .bird.t2,[data-art~="swallow-below"] .bird.t5{background-image:var(--img-swallow-below);aspect-ratio:195/200}
[data-art~="swallow-below"] .soar.s4{aspect-ratio:195/200}
[data-art~="swallow-below"] .soar.s4 > .in{background-image:var(--img-swallow-below)}
/* the crossing swallow: starts off the right edge, glides once across the sky, leaves off the left edge */
.bird.fly{left:100%;top:calc(var(--S) * .16);width:calc(var(--u) * 19);opacity:0}

.names-block{position:absolute;inset:0 0 auto;height:var(--S)}
.names-block:focus{outline:none}
.kicker{position:absolute;left:0;right:0;top:calc(var(--panel-top) - 34px);text-align:center;font-size:15px;font-style:italic;color:var(--brown);line-height:1.3}
/* the azulejo panel: 6 tiles, ~306 x 198 at 393 px (AZ), contact shadow lower right (one light) */
.panel{position:absolute;left:calc(var(--u) * 11);top:var(--panel-top);width:calc(var(--u) * 78);aspect-ratio:1100/711;container-type:inline-size;
  background:var(--img-names-panel) 0 0 / 100% 100% no-repeat;box-shadow:1px 2px 2px rgb(107 79 52 / .2), 3px 6px 14px rgb(107 79 52 / .1)}
/* names: serif capitals in the cartouche's clear centre, MAYA / e / TOMÁS like CASA / da / HORTA (AZ) */
.names{position:absolute;left:15%;right:15%;top:22%;bottom:24%;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-family:var(--serif);font-weight:600;color:var(--az-ink);font-size:11.2cqw;line-height:1;letter-spacing:.04em;text-align:center}
.pen .l{display:block;white-space:nowrap}
.pen .l.cap{text-transform:uppercase}
.pen .l.join{font-style:italic;font-weight:400;font-size:.9em;letter-spacing:0;line-height:.85;margin:.02em 0 .04em}
.pen .ch{display:inline-block}
/* the meadow round the panel: grass behind it (mirrored copies), the near grass and blooms in front */
.bgrass-l{left:calc(var(--u) * -2);top:calc(var(--y0) - var(--u) * 50);width:calc(var(--u) * 20);aspect-ratio:468/700;background-image:var(--img-grass-a);
  transform-origin:50% 100%;scale:-1 1}
.bgrass-r{left:calc(var(--u) * 82);top:calc(var(--y0) - var(--u) * 56);width:calc(var(--u) * 20);aspect-ratio:567/850;background-image:var(--img-grass-b);
  transform-origin:50% 100%;scale:-1 1}
.grass-l{left:calc(var(--u) * 1);top:calc(var(--y0) + 26px - var(--u) * 33);width:calc(var(--u) * 22);aspect-ratio:468/700;transform-origin:50% 100%}
.grass-l > .in{background-image:var(--img-grass-a);transform-origin:50% 100%}
.grass-r{left:calc(var(--u) * 76);top:calc(var(--y0) + 38px - var(--u) * 45);width:calc(var(--u) * 30);aspect-ratio:567/850;transform-origin:50% 100%}
.grass-r > .in{background-image:var(--img-grass-b);transform-origin:50% 100%}
/* with the new art, Portuguese lavender stands behind the panel's right edge in place of the mirrored grass */
[data-art~="lavender"] .bgrass-r{background-image:var(--img-lavender);aspect-ratio:179/400;scale:1 1;width:calc(var(--u) * 18);top:calc(var(--y0) - var(--u) * 58)}
.bloom{left:calc(var(--u) * 74);top:calc(var(--y0) - var(--u) * 15);width:calc(var(--u) * 28);aspect-ratio:1064/1100;background-image:var(--img-bloom);transform-origin:40% 80%}
.bloom-l{left:0;top:calc(var(--y0) - var(--u) * 8);width:calc(var(--u) * 16);aspect-ratio:1064/1100;background-image:var(--img-bloom);transform-origin:40% 80%;scale:-1 1}
/* NEW ART slots: the wildflower strip at the panel's foot (two pieces, centre medallion clear) and the dogs' paws; bindweed at
   the panel's lower right and the plaque's lower right. Hidden until their files arrive (data-art flags from the build) */
.strip,.bind{display:none}
[data-art~="meadow-strip"] .strip,[data-art~="bindweed"] .bind{display:block}
/* each piece shows the whole strip (400 x 152), the right one mirrored so it is not read as a copy */
.strip{aspect-ratio:400/152;background:var(--img-meadow-strip) 0 0 / 100% 100% no-repeat;transform-origin:50% 100%;
  /* the straight cut and both ends melt into the ground: two static gradients, intersected (never animated) */
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(#000 60%, transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(#000 60%, transparent);
  mask-composite:intersect}
.strip.s1{left:calc(var(--u) * 4);width:calc(var(--u) * 38);top:calc(var(--y0) - var(--u) * 12.4)}
.strip.s2{left:calc(var(--u) * 58);width:calc(var(--u) * 38);top:calc(var(--y0) - var(--u) * 12.4);scale:-1 1}
/* the two pieces at the dogs' paws read as a pasted patch on the path (looked, 2026-11-11): left out, the gate's own flower
   bed frames the dogs */
[data-art~="meadow-strip"] .strip.s3,[data-art~="meadow-strip"] .strip.s4{display:none}
.strip.s3{left:calc(var(--u) * 21);width:calc(var(--u) * 30);top:calc(var(--G) + var(--u) * 88)}
.strip.s4{left:calc(var(--u) * 51);width:calc(var(--u) * 30);top:calc(var(--G) + var(--u) * 88);scale:-1 1}
.bind{aspect-ratio:2/3;background:var(--img-bindweed) 0 0 / 100% 100% no-repeat}
.bind.b1{left:calc(var(--u) * 78);top:calc(var(--y0) - var(--u) * 30);width:calc(var(--u) * 16)}
.bind.b2{left:calc(var(--u) * 66);top:calc(var(--G) + var(--u) * 50);width:calc(var(--u) * 12);scale:-1 1}
.when{position:absolute;z-index:1;left:0;right:0;top:calc(var(--y0) + 34px);display:flex;flex-direction:column;align-items:center;text-align:center}
/* a soft paper glaze under the words, no box (IR B.9) */
.when::before{content:"";position:absolute;left:18%;right:18%;top:-14px;bottom:-14px;z-index:-1;
  background:radial-gradient(closest-side, rgb(246 239 223 / .75), rgb(246 239 223 / 0))}
.date{font-size:19px;font-style:italic;line-height:1.2}
.place{font-size:23px;line-height:1.15;letter-spacing:.01em;color:var(--warm-ink);margin-top:6px}
.when .village{color:var(--warm-ink)} /* over the far hills: warm ink keeps 4.5:1 (measured) */
.village{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brown);margin-top:3px;padding-left:.24em}

/* wider than a phone the wide washes stop inside the screen: feather their sides (static mask, never animated) */
@media (min-width:480px){
  .sky,.sky-b,.mist{-webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent)}
}
/* ---- screen 2: mist hills behind the words, the land under them ---- */
.mist{left:0;top:calc(var(--y0) + var(--u) * 4);width:calc(var(--u) * 100);aspect-ratio:1100/733;background-image:var(--img-mist)}
/* v11: the land rises 15u and fades in over its top 30%, so the mist hills read as its own distance (no seam over the trees) */
.land{left:calc(var(--u) * -9);top:calc(var(--y0) + var(--u) * 22);width:calc(var(--u) * 118);aspect-ratio:1100/753;
  -webkit-mask-image:linear-gradient(transparent, #000 30%);mask-image:linear-gradient(transparent, #000 30%)}
.near.land,html:not(.js) .land{background-image:var(--img-land)}
/* v13: the land's grass up 6u, roots in its foreground */
.grass-l2{left:calc(var(--u) * -5);top:calc(var(--y0) + var(--u) * 85);width:calc(var(--u) * 28);aspect-ratio:468/700;background-image:var(--img-grass-a);transform-origin:50% 100%}
.grass-r2{left:calc(var(--u) * 79);top:calc(var(--y0) + var(--u) * 93);width:calc(var(--u) * 26);aspect-ratio:567/850;background-image:var(--img-grass-b);transform-origin:50% 100%}
/* v13: the vine and the eucalyptus hang across the gap between the land and the gate, over the wall's two corners */
.vine{left:calc(var(--u) * -6);top:calc(var(--G) - var(--u) * 34);width:calc(var(--u) * 38);aspect-ratio:655/907;transform-origin:0 0}
.near.vine,html:not(.js) .vine{background-image:var(--img-grapevine)}
.euca{left:calc(var(--u) * 66);top:calc(var(--G) - var(--u) * 44);width:calc(var(--u) * 40);aspect-ratio:714/940;transform-origin:100% 0}
.euca > .in{transform-origin:60% 40%}
.near.euca-i,html:not(.js) .euca-i{background-image:var(--img-eucalyptus)}

/* ---- screen 3: the gate wall with the plaque, static (user, Message 36); v13: 18u higher ---- */
.gate-box{position:absolute;left:calc(var(--u) * -20);top:var(--G);width:calc(var(--u) * 140);aspect-ratio:1100/733}
.gate{inset:0;-webkit-mask-image:linear-gradient(transparent, #000 13%);mask-image:linear-gradient(transparent, #000 13%)} /* the fronds' cut top edge dissolves */
.near.gate,html:not(.js) .gate{background-image:var(--img-gate)}
/* plaque lettering: script like the real sign (user, 2026-11-10), live text in the tiles' clear centre (x 400-685, y 285-445 of 1100x733) */
.plaque-text{position:absolute;left:36.4%;width:25.9%;top:38.9%;height:21.8%;margin:0;container-type:inline-size;
  display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--script);font-weight:400;color:var(--az-ink);line-height:.82;text-align:center}
.plaque-text .q{font-size:30cqw}
.plaque-text .g{font-size:26cqw}
.plaque-text .do{font-size:.62em}
/* v13: crosses the plaque frame's lower-left corner, not the lettering */
.grass-p{left:calc(var(--u) * 9);top:calc(var(--G) + var(--u) * 52);width:calc(var(--u) * 22);aspect-ratio:567/850;background-image:var(--img-grass-b);transform-origin:50% 100%}
/* the foreground at your feet closes the page: two clumps rise from the bottom edge and bleed off it (IR B.1) */
.grass-f1{left:calc(var(--u) * -7);top:calc(var(--world-h) - var(--u) * 34);width:calc(var(--u) * 23);aspect-ratio:468/700;background-image:var(--img-grass-a);transform-origin:50% 100%}
.grass-f2{left:calc(var(--u) * 81);top:calc(var(--world-h) - var(--u) * 32);width:calc(var(--u) * 24);aspect-ratio:567/850;background-image:var(--img-grass-b);transform-origin:50% 100%}
.foot{position:absolute;left:0;right:0;top:calc(var(--y0) + var(--u) * 262);display:flex;flex-direction:column;align-items:center;text-align:center}

.foot .date{font-size:17px;margin-top:4px}
.again{margin-top:28px;min-height:44px;padding:0 18px;border:1px solid rgb(184 148 106 / .7);border-radius:999px;background:transparent;font-size:15px;color:var(--brown);cursor:pointer}

/* ---- the citrus bough, top right (v12 art): the twig enters past the right edge, three fruit hang from its stalks.
   v13: it arrives with the meadow (4.7 s); each fruit is a box that settles once and an image that swings on its own period */
.bough{left:calc(var(--u) * 56.5);top:calc(var(--u) * -12);width:calc(var(--u) * 45.45);aspect-ratio:600/437;background-image:var(--img-bough);
  transform-origin:100% 64%}
.js .bough{opacity:0}
.fruit{position:absolute;display:block;transform-origin:50% 0}
.fruit > .in{transform-origin:50% 0}
.f-lemon-a{left:calc(52.4% - 10.65%);top:100%;width:21.3%;aspect-ratio:128/201;z-index:2}
.f-orange{left:calc(72.8% - 14.85%);top:100%;width:29.7%;aspect-ratio:178/200;z-index:1}
.f-lemon-b{left:calc(86.9% - 8.25%);top:74.3%;width:16.5%;aspect-ratio:120/127}

/* ---- the user's four dogs, together on the path below the plaque (v12); v13: 18u higher, the same split curves as the
   reveal (opacity on the glaze, the rise on the ease-out), and the sine breath ---- */
.dogs{position:absolute;left:0;right:0;top:calc(var(--y0) + var(--u) * 218);height:calc(var(--u) * 36);pointer-events:none}

.dog::before{content:"";position:absolute;left:12%;right:6%;bottom:-2.2%;height:7%;
  background:radial-gradient(closest-side, rgb(107 79 52 / .28), rgb(107 79 52 / 0))}
.d-tan{left:calc(var(--u) * 22.5);width:calc(var(--u) * 15.5);aspect-ratio:394/600;--sd:0s;z-index:1;bottom:calc(var(--u) * 1.6)}
.d-collie{left:calc(var(--u) * 34.2);width:calc(var(--u) * 18);aspect-ratio:389/600;--sd:.12s;z-index:2}
.d-golden{left:calc(var(--u) * 48.2);width:calc(var(--u) * 19.5);aspect-ratio:341/600;--sd:.24s;z-index:4;bottom:calc(var(--u) * .4)}
.d-merle{left:calc(var(--u) * 63.5);width:calc(var(--u) * 16);aspect-ratio:404/600;--sd:.36s;z-index:3;bottom:calc(var(--u) * 1.6)}
.near.d-tan-i{background-image:var(--img-dog-tan)}
.near.d-collie-i{background-image:var(--img-dog-collie)}
.near.d-golden-i{background-image:var(--img-dog-golden)}
.near.d-merle-i{background-image:var(--img-dog-merle)}
.near.d-tail{background-image:var(--img-dog-merle-tail)}
.d-tail{transform-origin:84.5% 73%}

/* ---------- the reveal (v13): four overlapping waves, back to front; every delay is from the tap; .go is set at the tap ----------
   Each entrance is two animations: opacity on the near-linear glaze, movement on the ease-out, so nothing pops and every
   move lands softly. Travel grows with nearness: far 0-5 px, middle 10-12 px, near 14-26 px. Decoration fades only.
   1.70 world; 1.90 C1; 2.00 mist; 2.15 panel; 2.55 opening line; 2.85-3.85 names; 2.95 land; 3.05 C2; 3.80 olive A, 4.02 B;
   3.85 back grass L; 3.95/4.07/4.15 date, place, village; 4.12 back grass R; 4.30 grass-l; 4.62 bloom; 4.70 citrus;
   4.95 grass-r; 5.08 small bloom; 5.45 strip; 5.60/6.15 swallows; 8.00-10.60 the crossing swallow. */
@keyframes washin{from{opacity:0}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade55{from{opacity:0}to{opacity:.55}}
@keyframes fade60{from{opacity:0}to{opacity:.6}}
@keyframes pen{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
@keyframes rise3{from{transform:translateY(3px)}}
@keyframes rise4{from{transform:translateY(4px)}}
@keyframes rise5{from{transform:translateY(5px)}}
@keyframes rise10{from{transform:translateY(10px)}}
@keyframes rise12{from{transform:translateY(12px)}}
@keyframes rise18{from{transform:translateY(18px)}}
@keyframes panel-in{from{transform:translateY(10px) scale(.985)}}
@keyframes grow12{from{transform:translateY(12px) scaleY(.94)}}
@keyframes grow14{from{transform:translateY(14px) scaleY(.94)}}
@keyframes grow22{from{transform:translateY(22px) scaleY(.92)}}
@keyframes grow26{from{transform:translateY(26px) scaleY(.92)}}
@keyframes bloom14{from{transform:translateY(14px) scale(.96)}}
/* the olive slides in from its own corner with a small settle about the corner; the bough from beyond the right edge */
@keyframes corner16{from{transform:translate(-16px,-12px) rotate(-2.5deg)}}
@keyframes bough-in{from{transform:translate(18px,-14px) rotate(1.5deg)}}
@keyframes settle4{0%{rotate:4deg}35%{rotate:-2deg}65%{rotate:.8deg}100%{rotate:0deg}}
@keyframes cross{0%{opacity:0;transform:translate(0,0) rotate(4deg)}8%{opacity:1}
  50%{transform:translate(calc(var(--u) * -70), 26px) rotate(-2deg)}92%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--u) * -140), 6px) rotate(-8deg)}}
.js .seq,.js .go-art,.js .pen .ch{opacity:0}
.js .go .seq{animation:fade .9s var(--ease-glaze) var(--d,0s) both, rise4 1s var(--ease-out) var(--d,0s) both}
.js .go .date.seq{animation-name:fade, rise5}
.js .go .village.seq{animation-name:fade, rise3}
.js .go .pen .ch{animation:pen .16s var(--ease-out) var(--d) both}
.js .go .c1{animation:fade55 2.4s var(--ease-glaze) 1.9s both}
.js .go .mist{animation:fade 2.4s var(--ease-glaze) 2s both, rise5 2.8s var(--ease-out) 2s both}
.js .go .panel{animation:fade 1s var(--ease-glaze) 2.15s both, panel-in 1.4s var(--ease-out) 2.15s both}
.js .go .land{animation:fade 2.2s var(--ease-glaze) 2.95s both, rise12 2.8s var(--ease-out) 2.95s both}
.js .go .c2{animation:fade60 2.6s var(--ease-glaze) 3.05s both}
.js .go .olive{animation:fade 1.6s var(--ease-glaze) 3.8s both, corner16 3s var(--ease-out) 3.8s both}
.js .go .olive-b > .in{animation:fade 1.6s var(--ease-glaze) 4.02s both, corner16 3s var(--ease-out) 4.02s both}
.js .go .bgrass-l{animation:fade 1.6s var(--ease-glaze) 3.85s both, grow14 2.4s var(--ease-out) 3.85s both, sw07 5.15s var(--ease-sine) -2.42s infinite alternate}
.js .go .bgrass-r{animation:fade 1.6s var(--ease-glaze) 4.12s both, grow12 2.4s var(--ease-out) 4.12s both, sw07 6.15s var(--ease-sine) -4s infinite alternate}
.js .go .grass-l > .in{animation:fade 1.6s var(--ease-glaze) 4.3s both, grow22 2.6s var(--ease-out) 4.3s both, sw10 4.55s var(--ease-sine) -2.3s infinite alternate}
.js .go .bloom{animation:fade 1.4s var(--ease-glaze) 4.62s both, bloom14 2.4s var(--ease-out) 4.62s both, sw07 4.85s var(--ease-sine) -1.3s infinite alternate}
.js .go .bough{animation:fade 1.8s var(--ease-glaze) 4.7s both, bough-in 3.4s var(--ease-out) 4.7s both, sw05 8.1s var(--ease-sine) -6s infinite alternate}
.js .go .fruit{animation:settle4 3.4s var(--ease-out) 4.7s both}
.js .go .grass-r > .in{animation:fade 1.6s var(--ease-glaze) 4.95s both, grow26 3s var(--ease-out) 4.95s both, sw12 4.35s var(--ease-sine) -1.24s infinite alternate}
.js .go .bloom-l{animation:fade 1.4s var(--ease-glaze) 5.08s both, rise10 2.2s var(--ease-out) 5.08s both, sw05 4.15s var(--ease-sine) -2.36s infinite alternate}
.js .go .strip.s1,.js .go .strip.s2{animation:fade 1.6s var(--ease-glaze) 5.45s both, rise18 2.8s var(--ease-out) 5.45s both}
.js .go .bind.b1{animation:fade 1.6s var(--ease-glaze) 5.6s both}
.js .go .bird.t1{animation:fade 1.6s var(--ease-glaze) 5.6s both}
.js .go .bird.t2{animation:fade 1.6s var(--ease-glaze) 6.15s both}
.js .go .bird.fly{animation:cross 2.6s var(--ease-fold) 8s both}

/* ambient (v13, comps/V12-CHOREOGRAPHY-ADVICE.md section 3): every loop is a sine, infinite alternate, so the CSS duration is
   half the period; each starts mid-cycle (negative delay) and is already moving as it fades in. The two sky planes start at
   1.7 s from rest, so the flap's sky still matches at the hand-over. No two periods on a screen are near a simple ratio.
   v13 deviation from the advice: inside each meadow group the plants keep their own periods (8.3 to 12.3 s) instead of one
   shared 9.1 s, and the three fruits swing at 7.4, 9.6 and 11.2 s (not 7.4, 7.9, 8.3), so no two move in step. Continuous by the user's choice (2026-11-11); WCAG 2.2.2 would normally want
   a pause control. Paused while out of view; off in reduced motion. */
@keyframes drift-sx{to{translate:-36px 0}}
@keyframes drift-sy{to{translate:0 -4px}}
@keyframes drift-bx{to{translate:28px 0}}
@keyframes drift-by{to{translate:0 3px}}
@keyframes drift-c1x{from{translate:-20px 0}to{translate:20px 0}}
@keyframes drift-c1y{from{translate:0 -4px}to{translate:0 4px}}
@keyframes drift-c2x{from{translate:28px 0}to{translate:-28px 0}}
@keyframes drift-c2y{from{translate:0 -5px}to{translate:0 5px}}
@keyframes sw04{from{rotate:-.4deg}to{rotate:.4deg}}
@keyframes sw05{from{rotate:-.5deg}to{rotate:.5deg}}
@keyframes sw06{from{rotate:-.6deg}to{rotate:.6deg}}
@keyframes sw07{from{rotate:-.7deg}to{rotate:.7deg}}
@keyframes sw08{from{rotate:-.8deg}to{rotate:.8deg}}
@keyframes sw10{from{rotate:-1deg}to{rotate:1deg}}
@keyframes sw12{from{rotate:-1.2deg}to{rotate:1.2deg}}
@keyframes sw14{from{rotate:-1.4deg}to{rotate:1.4deg}}
@keyframes sw16{from{rotate:-1.6deg}to{rotate:1.6deg}}
@keyframes sw18{from{rotate:-1.8deg}to{rotate:1.8deg}}
@keyframes soar{from{translate:-6px 0}to{translate:6px 0}}
@keyframes bob3{from{translate:0 -3px;rotate:-6deg}to{translate:0 3px;rotate:-2deg}}
@keyframes bob4{from{translate:0 -3px;rotate:6deg}to{translate:0 3px;rotate:10deg}}
@keyframes breath{from{scale:1}to{scale:1.016}}
@keyframes tail{from{rotate:-4deg}to{rotate:4deg}}
/* the advice's first cut for a weak phone, taken (measured, 2026-11-11): the sky planes keep only their sideways drift; their
   slow vertical wrappers stay still (they are the two largest layers) */
.js .go .sky > .in{animation:drift-sx 59s var(--ease-sine) 1.7s infinite alternate}
/* v13 perf pass: sky-b (20% opacity) no longer drifts, and pieces keep one rhythm each (the second, slower wrapper
   rhythms on the olive, both grasses, the eucalyptus and the cloud veils are gone): six fewer moving layers, measured */
.js .go .c1 > .in{animation:drift-c1x 37s var(--ease-sine) -11s infinite alternate}
.js .go .c2 > .in{animation:drift-c2x 29s var(--ease-sine) -19s infinite alternate}
.js .go .olive > .in{animation:sw04 4.7s var(--ease-sine) -6.2s infinite alternate}
.js .go .olive-b{animation:sw07 5.9s var(--ease-sine) -2.3s infinite alternate}
.js .go .f-orange > .in{animation:sw14 3.7s var(--ease-sine) -1s infinite alternate}
.js .go .f-lemon-a > .in{animation:sw18 4.8s var(--ease-sine) -2.9s infinite alternate}
.js .go .f-lemon-b > .in{animation:sw16 5.6s var(--ease-sine) -4.4s infinite alternate}
.js .go .grass-l2{animation:sw10 4.55s var(--ease-sine) -2.45s infinite alternate}
.js .go .grass-r2{animation:sw10 4.95s var(--ease-sine) -1.3s infinite alternate}
.js .go .vine{animation:sw08 7.9s var(--ease-sine) -4s infinite alternate}
.js .go .euca{animation:sw08 6.1s var(--ease-sine) -9s infinite alternate}
.js .go .grass-p{animation:sw10 4.25s var(--ease-sine) -3.1s infinite alternate}
.js .go .grass-f1{animation:sw10 5.25s var(--ease-sine) -0.6s infinite alternate}
.js .go .grass-f2{animation:sw10 4.7s var(--ease-sine) -2.9s infinite alternate}
.js .go .soar.s3{animation:soar 13.4s var(--ease-sine) -4.1s infinite alternate}
.js .go .soar.s4{animation:soar 13.4s var(--ease-sine) -9.7s infinite alternate}
.js .go .soar.s3 > .in{animation:bob3 8.6s var(--ease-sine) -4.1s infinite alternate}
.js .go .soar.s4 > .in{animation:bob4 8.6s var(--ease-sine) -9.7s infinite alternate}
.dogs.seen .d-tan{animation:breath 1.3s var(--ease-sine) -.4s infinite alternate}
.dogs.seen .d-merle{animation:breath 1.45s var(--ease-sine) -1.1s infinite alternate}
.dogs.seen .d-collie{animation:breath 1.65s var(--ease-sine) -2s infinite alternate}
.dogs.seen .d-golden{animation:breath 1.85s var(--ease-sine) -.7s infinite alternate}
.dogs.seen .d-tail{animation:tail 1.55s var(--ease-sine) -.9s infinite alternate}
/* one pale glint crosses the glazed tiles at 11.5 s and then once a minute; it only lightens the glaze, under the names */
.glint{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.glint i{position:absolute;top:-10%;bottom:-10%;left:0;width:34%;transform:translateX(-110%);
  background:linear-gradient(100deg, rgb(255 255 255 / 0), rgb(255 255 255 / .16) 50%, rgb(255 255 255 / 0))}
@keyframes glint{0%{transform:translateX(-110%)}2.52%,100%{transform:translateX(310%)}}
.js .go .glint i{animation:glint 63.5s linear 11.5s infinite}
/* the rare bird: one more crossing about every 50 s, three times (a second copy, so the first crossing stays a one-off);
   constant speed on purpose: a gliding swallow keeps its speed (the first crossing carries the eased in-and-out) */
@keyframes cross-rare{0%{opacity:0;transform:translate(0,0)}1.2%{opacity:1}2.8%{opacity:1}4%,100%{opacity:0;transform:translate(calc(var(--u) * -140), 14px)}}
.js .go .bird.fly.rare{animation:cross-rare 52s linear 18s infinite}   /* v11: first crossing at 18 s, then every 52 s */

/* lite-motion (weaker phones): the same page; the sky and the two cloud veils hold still, the grass behind the panel does
   not sway, and the meadow wave is tighter and shorter (3.8 to 4.3 s, landing by about 5.8 s) */
.lite-motion .sky > .in,.lite-motion .c1 > .in,.lite-motion .c2 > .in{animation:none !important}
.lite-motion.js .go .olive{animation:fade .9s var(--ease-glaze) 3.8s both, corner16 1.6s var(--ease-out) 3.8s both}
.lite-motion.js .go .olive-b > .in{animation:fade .9s var(--ease-glaze) 3.9s both, corner16 1.6s var(--ease-out) 3.9s both}
.lite-motion.js .go .bgrass-l{animation:fade .9s var(--ease-glaze) 3.85s both, grow14 1.4s var(--ease-out) 3.85s both}
.lite-motion.js .go .bgrass-r{animation:fade .9s var(--ease-glaze) 3.95s both, grow12 1.4s var(--ease-out) 3.95s both}
.lite-motion.js .go .grass-l > .in{animation:fade .9s var(--ease-glaze) 4s both, grow22 1.5s var(--ease-out) 4s both, sw10 4.55s var(--ease-sine) -2.3s infinite alternate}
.lite-motion.js .go .bloom{animation:fade .9s var(--ease-glaze) 4.1s both, bloom14 1.4s var(--ease-out) 4.1s both, sw07 4.85s var(--ease-sine) -1.3s infinite alternate}
.lite-motion.js .go .bough{animation:fade 1s var(--ease-glaze) 4.15s both, bough-in 1.6s var(--ease-out) 4.15s both, sw05 8.1s var(--ease-sine) -6s infinite alternate}
.lite-motion.js .go .fruit{animation:settle4 1.8s var(--ease-out) 4.15s both}
.lite-motion.js .go .grass-r > .in{animation:fade .9s var(--ease-glaze) 4.2s both, grow26 1.6s var(--ease-out) 4.2s both, sw12 4.35s var(--ease-sine) -1.24s infinite alternate}
.lite-motion.js .go .bloom-l{animation:fade .9s var(--ease-glaze) 4.25s both, rise10 1.3s var(--ease-out) 4.25s both, sw05 4.15s var(--ease-sine) -2.36s infinite alternate}
.lite-motion.js .go .strip.s1,.lite-motion.js .go .strip.s2{animation:fade .9s var(--ease-glaze) 4.3s both, rise18 1.5s var(--ease-out) 4.3s both}

/* reduced motion: open instantly, the art fades in together in 200 ms, no drift, no birds crossing (CC 4.12) [WG][AN][CH] */
@media (prefers-reduced-motion:reduce){
  .move,.tp,.bt,.seal,.wax,.deco,.half,.g-top,.g-bot{transition-duration:1ms !important;transition-delay:0s !important}
  .shade,.hinge,.gl i{animation:none !important}
  .sheet.is-open,.opened .world{transition-duration:.2s !important;transition-delay:0s !important}
  .light,.bird.fly{display:none}
  .js .go .seq,.js .go .pen .ch,.js .go .go-art{animation:washin .2s linear both !important}
  .js .go .sky,.js .go .sky-b{animation:none !important}
  .glint,.leaf{display:none !important}
  .amb,.fruit,.dog,.d-tail,.soar,.soar > .in{animation:none !important}
  .js .go .bough{animation:washin .2s linear both !important}
  .dog{translate:none}
}
</style>

      <!-- the user's four dogs; decorative here. TODO(user): a line of copy if they should be announced -->
      <div class="dogs" id="dogs" aria-hidden="true">
        <span class="dog d-tan"><i class="d-tan-i" data-lazy></i></span>
        <span class="dog d-collie"><i class="d-collie-i" data-lazy></i></span>
        <span class="dog d-merle"><i class="d-merle-i" data-lazy></i><i class="d-tail" data-lazy></i></span>
        <span class="dog d-golden"><i class="d-golden-i" data-lazy></i></span>
      </div>
      <i class="art strip s3"></i><i class="art strip s4"></i>
      <i class="art bird t5"></i>
      <i class="art grass-f1 amb"></i><i class="art grass-f2 amb"></i>
      <div class="foot">
        <p class="village" lang="pt-PT" translate="no">Milharado</p>
        <p class="date" data-i18n="date">10 de julho de TODO(user)</p>
        <button type="button" class="again" id="again" data-i18n="again">Fechar e ver de novo</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="move">
      <div class="ground g-mid" aria-hidden="true"></div>
      <div class="ground g-top" aria-hidden="true"></div>
      <div class="ground g-bot" aria-hidden="true"></div>
      <div class="pnl mid paper" aria-hidden="true"><span class="crease"></span><span class="hinge h-top"></span><span class="hinge h-bot"></span></div>
      <div class="folds">
        <div class="pnl bt" id="bt" aria-hidden="true">
          <div class="face face-in paper"><span class="crease"></span><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <div class="pnl tp" aria-hidden="true">
          <div class="face face-in paper"><div class="flap-sky"><i></i></div><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <!-- the seal halves ride copies of the two flaps (same box, origin, transform and timing), above both papers -->
        <div class="pnl bt ride" aria-hidden="true"><div class="face face-out"><i class="half half-lo"></i></div></div>
        <div class="pnl tp ride" aria-hidden="true"><div class="face face-out"><i class="half half-up"></i></div></div>
      </div>
      <div class="closed-deco" aria-hidden="true"><i class="deco deco-l"></i><i class="deco deco-r"></i></div>
      <div class="light" id="light" aria-hidden="true"><i></i></div>
      <button type="button" class="seal" id="seal">
        <span class="wax" aria-hidden="true"></span>
        <span class="seal-label" data-i18n="seal">Toca para abrir</span>
      </button>
    </div>
  </div>
</main>

<script>
(function(){
  var T = {
    'pt-PT': {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de abertura', join:'e', date:'10 de julho de TODO(user)', card:'Convite', again:'Fechar e ver de novo'},
    'en':    {seal:'Tap to open', skip:'Skip', kicker:'TODO(user) · opening line', join:'and', date:'10 July TODO(user)', card:'Invitation', again:'Close and replay'},
    'es':    {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de apertura', join:'y', date:'10 de julio de TODO(user)', card:'Invitación', again:'Cerrar y repetir'}
  };
  var code = new URLSearchParams(location.search).get('lang') || 'pt-PT';
  if (!T[code]) code = 'pt-PT';
  var t = T[code];
  document.documentElement.lang = code;
  if (new URLSearchParams(location.search).get('sharp') === '1') document.documentElement.classList.add('sharp');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t[el.getAttribute('data-i18n')]; });

  var $ = function(s, r){ return (r || document).querySelector(s); }, $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var page = $('#page'), sheet = $('#sheet'), seal = $('#seal'), skip = $('#skip'), names = $('#names'), light = $('#light');
  names.setAttribute('aria-label', t.card);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  /* the names, one span per letter: MAYA / e / TOMÁS (capitals by CSS, the copy stays as written) */
  $('.pen').innerHTML = ['Maya', t.join, 'Tomás'].map(function(line, li){
    return '<span class="l ' + (li === 1 ? 'join' : 'cap') + '">' + line.split('').map(function(c){
      return c === ' ' ? ' ' : '<span class="ch">' + c + '</span>';
    }).join('') + '</span>';
  }).join('');

  /* ---- the timeline, seconds from the tap [CH] one lead at a time; full table in V10-NOTES.md ----
     0 to .10 press; 0 the seal cracks, .06 to .42 twine and label go; .16 to 1.46 top fold + sheet; 1.04 to 2.20 bottom fold;
     1.70 to 2.50 the world comes up under the sheet (margins turn to paper, the sky widens); 2.20 to 2.90 the sheet dissolves;
     2.40 panel glaze; 2.55 opening line; 2.85 to 3.85 names by glyph advance (lift between lines); 3.95/4.07/4.15 date,
     place, village (uneven gaps, no metronome); 4.30 to 5.60 olive from its corner; 4.90/5.10 two tiny swallows; 5.40 left
     grass; 5.80 right grass; 6.30 bloom; 6.80 to 8.80 mist hills and land glaze together; 8.20 to 10.30 one swallow crosses;
     Skip fades at 10.0 on the animation clock; from 10.5 ambient only (cloud drift, a glint at 11.5 s, sway from 13 s, a rare
     bird every ~52 s from 18 s), continuous by the user's choice. */
  var NAMES_AT = 2.85, NAMES_END = 3.85, LIFT = .12;
  function timeNames(){
    var lines = $$('.pen .l'), total = 0, ws = [];
    lines.forEach(function(l){ $$('.ch', l).forEach(function(c){ var w = c.getBoundingClientRect().width || 10; ws.push(w); total += w; }); });
    var span = NAMES_END - NAMES_AT - .16 - LIFT * (lines.length - 1), x = 0, i = 0;
    lines.forEach(function(l, li){
      $$('.ch', l).forEach(function(c){
        c.style.setProperty('--d', (NAMES_AT + x / total * span + li * LIFT).toFixed(3) + 's');
        x += ws[i++];
      });
    });
  }

  /* ---- before the tap: measure the names once the fonts are in, and decode the screen-1 art while the letter waits,
     so the tap frame does no layout read and no image decode (the folds keep 60 fps) [AN] animation-performance ---- */
  var timed = false;
  function timeOnce(){ if (!timed) { timed = true; timeNames(); } }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(timeOnce);
  function warm(){ document.documentElement.classList.add('warm'); }
  /* frame-time probe: if the closed letter cannot hold 50 fps for 600 ms, take the lighter motion tier */
  if (!/[?&]motion=/.test(location.search) && !document.documentElement.classList.contains('lite-motion') && window.requestAnimationFrame) {
    addEventListener('load', function(){
      var f = [], t0 = 0;
      (function tick(t){ if (!t0) t0 = t; f.push(t); if (t - t0 < 600 && !page.classList.contains('opened')) requestAnimationFrame(tick); else {
        var g = []; for (var i = 1; i < f.length; i++) g.push(f[i] - f[i - 1]); g.sort(function(a, b){ return a - b; });
        if (g.length > 5 && g[Math.floor(g.length / 2)] > 20) document.documentElement.classList.add('lite-motion');
      } })(0);
    });
  }
  addEventListener('load', function(){
    warm();   // the letter (the poster) is up: now fetch the painted art while the guest looks at it
    (window.requestIdleCallback || setTimeout)(function(){
      /* the seal halves and the flaps' faces too: they first show at the tap */
      $$('.world .art:not([data-lazy]), .world .in:not([data-lazy]), .sheet .half, .sheet .face, .flap-sky').forEach(function(el){
        var m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);
        if (m) { var im = new Image(); im.src = m[1]; if (im.decode) im.decode().catch(function(){}); }
      });
    });
  });

  /* ---- closed: the idle light from 2.5 s, stopped for good by the first touch or focus (CC 6.8) ---- */
  var lightT = reduce ? 0 : setTimeout(function(){ light.classList.add('on'); }, 2500);
  function stopLight(){ clearTimeout(lightT); light.classList.remove('on'); }
  document.addEventListener('pointerdown', stopLight, {once:true});
  seal.addEventListener('pointerdown', function(){ seal.classList.add('pressed'); });
  seal.addEventListener('focus', stopLight);

  /* ---- finishing: what still runs ends within 300 ms (Skip; the names block leaving the view, CC 4.11, 4.12).
     The ambient (cloud drift, the rare bird) is left alone: it is slow by design and never part of the reveal. ---- */
  /* the ambient: never hurried, paused while out of view */
  var AMBIENT = /^(drift|cross-rare|sweep|gust|sway|sw\d|leaf|glint|settle|breath|wag|tail|bob|soar)/;
  function hurry(anims){
    anims.forEach(function(a){
      if (AMBIENT.test(a.animationName || '')) return;
      var tg = a.effect && a.effect.target;
      if (tg && tg.closest && tg.closest('.dogs')) return;   /* the dogs come in when they are seen, not on the reveal clock */
      var ct = a.effect && a.effect.getComputedTiming(), left = ct ? ct.endTime - (a.currentTime || 0) : 0;
      if (isFinite(left) && left > 300) a.updatePlaybackRate(left / 300);
    });
  }

  /* ---- lower scenes: their image is applied one screen before they come into view (first load stays small) ---- */
  var near = null, leave = null, seenDogs = null, dogs = $('#dogs');
  function watch(){
    var lazies = $$('[data-lazy]');
    if (!('IntersectionObserver' in window)) { lazies.forEach(function(el){ el.classList.add('near'); }); return; }
    near = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('near'); near.unobserve(e.target); } }); }, {rootMargin:'100% 0px 100% 0px'});
    lazies.forEach(function(el){ near.observe(el); });
    leave = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.intersectionRatio < .05) hurry(page.getAnimations({subtree:true})); }); }, {threshold:[0, .05]});
    leave.observe(names);
    /* the dogs come in when a third of the group is in view */
    seenDogs = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('seen'); seenDogs.unobserve(e.target); } }); }, {threshold:.3});
    seenDogs.observe(dogs);
  }

  /* ---- open ---- */
  function open(){
    if (sheet.classList.contains('is-open')) return;
    stopLight(); seal.classList.add('pressed'); warm();
    page.classList.add('opened', 'go'); sheet.classList.add('is-open', 'crack');
    timeOnce();
    seal.disabled = true;
    if (reduce) { sheet.classList.add('instant'); finish(true); return; }
    later(function(){ names.focus({preventScroll:true}); }, 3200);
    later(watch, 2350);
    later(wake, 2200);
    /* Skip leaves on the animation clock, not a timer, so it always matches the reveal it skips (a timer let it leave
       early whenever the animation clock ran slower than the wall clock, as in slowed captures): v13: held to 10.4 s, out by 10.6 s, as the crossing swallow ends */
    skipExit = skip.animate([{opacity:1}, {opacity:1, offset:.98}, {opacity:0}], {duration:10600, fill:'forwards'});
    skipExit.finished.then(function(){ skip.classList.add('out'); skip.hidden = true; skipExit.cancel(); skipExit = null; }, function(){});
    requestAnimationFrame(function(){ requestAnimationFrame(ambientWatch); });
  }
  var skipExit = null;
  function finish(now){
    alive = true;
    if (skipExit) { skipExit.cancel(); skipExit = null; }
    if (!sheet.classList.contains('is-open')) { sheet.classList.add('instant'); open(); }
    hurry(document.getAnimations());
    if (!near) watch();
    names.focus({preventScroll:true});
    timers.forEach(clearTimeout); timers = [];
    skip.classList.add('out');
    setTimeout(function(){ skip.hidden = true; }, now ? 0 : 300);
    requestAnimationFrame(function(){ requestAnimationFrame(ambientWatch); });
  }

  /* ---- ambient control: each ambient animation runs only while its element is in view (battery) ---- */
  var seen = new Map(), amb = null, AMB_SEL = '.amb, .glint, .bird.fly.rare, .dogs';
  /* subtree: the glint's band starts outside its clipped box, so the box is what is watched */
  function ambientOf(el){ return el.getAnimations({subtree:true}).filter(function(a){ return AMBIENT.test(a.animationName || ''); }); }
  /* the loops that start mid-cycle (negative delay) are held, frozen at their phase, until the sheet is open (2.2 s): while it
     opens, nothing under it needs to move (measured: they cost long frames during the folds) */
  var alive = false;
  function midLoop(a){ var t = a.effect && a.effect.getTiming(); return t && t.iterations === Infinity && t.delay < 0; }
  /* perf pass: a loop also waits, frozen at its phase, while its piece (or the box it hangs in) is still entering, so the
     loops do not stack on the entrances during the busiest seconds of the reveal; it starts as the piece lands */
  var busy = null;   /* the pieces still entering, gathered once per pass (one getAnimations call, not one per piece) */
  function entering(t){
    for (var n = t, k = 0; n && k < 3; n = n.parentElement, k++) if (busy && busy.has(n)) return true;
    return false;
  }
  function pass(){
    busy = new Set();
    document.getAnimations().forEach(function(x){
      if (x.animationName && !AMBIENT.test(x.animationName) && x.playState === 'running' && x.effect) busy.add(x.effect.target);
    });
    $$(AMB_SEL).forEach(apply);
  }
  var queued = false;
  function soon(){ if (!queued) { queued = true; requestAnimationFrame(function(){ queued = false; pass(); }); } }
  function apply(el){
    ambientOf(el).forEach(function(a){
      if (seen.get(el) === false || (midLoop(a) && (!alive || entering(a.effect.target)))) { if (a.playState === 'running') a.pause(); }
      else if (a.playState === 'paused') a.play();
    });
  }
  function wake(){ alive = true; pass(); }

  /* perf pass: an entrance that has ended still holds its layer (fill: both keeps it "active"), and every layer it keeps
     drags its neighbours into layers too (overlap). So when an entrance ends, its end values are written as plain style and
     the animation is dropped: the piece stays exactly where it landed, its layer is freed; any loop on it keeps running.
     Measured at 430 x 932, 15 s: 59 layers before. Replay clears the written styles. */
  var settled = [];
  page.addEventListener('animationend', function(e){
    if (AMBIENT.test(e.animationName) || !e.target.closest('.world')) return;
    e.target.getAnimations().forEach(function(a){
      if (a.animationName === e.animationName && a.playState === 'finished') {
        try { a.commitStyles(); a.cancel(); settled.push(e.target); } catch (err) {}
      }
    });
    if (alive) soon();   /* wake the loops whose piece has just landed (one batched pass per frame) */
  });
  function ambientWatch(){
    if (reduce) return;
    if (!amb && 'IntersectionObserver' in window) {
      amb = new IntersectionObserver(function(es){ es.forEach(function(e){ seen.set(e.target, e.isIntersecting); apply(e.target); }); });
      $$(AMB_SEL).forEach(function(el){ amb.observe(el); });
    }
    pass();
  }
  seal.addEventListener('click', function(){ open(); });
  skip.addEventListener('click', function(){ finish(false); });

  /* prototype only: close and replay */
  $('#again').addEventListener('click', function(){
    timers.forEach(clearTimeout); timers = [];
    [near, leave, seenDogs].forEach(function(o){ if (o) o.disconnect(); }); near = leave = seenDogs = null;
    dogs.classList.remove('seen');
    alive = false;
    settled.forEach(function(el){ el.style.removeProperty('opacity'); el.style.removeProperty('transform'); }); settled = [];
    window.scrollTo(0, 0);
    sheet.classList.add('instant');
    sheet.classList.remove('is-open', 'crack'); page.classList.remove('opened', 'go');
    seal.classList.remove('pressed'); seal.disabled = false;
    skip.hidden = false; skip.classList.remove('out');
    if (skipExit) { skipExit.cancel(); skipExit = null; }
    seal.focus({preventScroll:true});
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ sheet.classList.remove('instant'); }); });
  });
})();
</script>
</body>
</html>
