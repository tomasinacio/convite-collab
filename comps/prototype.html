<head>

<meta name="theme-color" content="#E3E2D6">
<title>Maya e Tomás</title>
<link rel="icon" href="data:,">

<!-- owner: Tomas | prototype r8b (illustrated-reveal, stage 1 to 2 bridge) | 2026-11-10 | NOT final art
     What a guest sees, in order: the closed letter-folded sheet with the wax seal (Skip first in focus order); a tap breaks the
     seal, the top fold lifts (the sheet moves down only as far as the screen needs), then the bottom fold drops in view
     (concept 2 of fold-concepts.html, vertical only); the names in a 4 x 2 azulejo pane with thin weeds, the date and place
     set as on the quinta sign (D3, in the house serif: Allura + EB Garamond only); then a short land scene that closes on a
     PLACEHOLDER of the quinta plaque.
     Motion: transform and opacity only, plus stroke-dashoffset for the few ink lines (user, 2026-11-10). One sequence; see
     MOTION-NOTES.md (r8b). r8b applies the red team and spec guardian of r8 (REDTEAM.md).
     Stand-in art: clouds, swallows, branch, hills, olive tree and the closed sprig are crops from the user's deck (deck-crops/);
     the plaque is a placeholder, not traced from the photo. Prototype-only: the replay control at the very end, and
     ?lang=en or ?lang=es in the address. Previous: r8 (no copy kept; it was a first prototype in this same file). -->
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --paper:#F6EFDF; --sand:#E6D6B8; --ink:#3B2F25; --olive:#4F5F2E; --terracotta:#9A4C32;
  --brown:#6B4F34; --sage:#9DAE82; --twine:#B8946A; --clay:#C98B6B; --lemon:#EBDDA0; --azulejo:#7F9BA8;
  --blush:#E7C3B2; --shade:#E3E2D6; --cobalt:#4E6B8D; --warm-ink:#4A3B2E;
  --sun: drop-shadow(1px 1.5px 1px rgb(59 47 37 / .14)) drop-shadow(3px 7px 8px rgb(59 47 37 / .09));
  --script:'Allura', cursive;
  --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
  --ease-out:cubic-bezier(.22,.8,.24,1); --ease-io:cubic-bezier(.45,.05,.25,1);
  /* the sheet: a letter fold. Ht the top fold (short, the sky), Hm the middle (the names), Hb the bottom fold (shorter, it nests).
     P is where the closed packet sits; D is how far the sheet moves down as the top lifts, only what keeps the opened top fold
     on screen. So, open, the sky, the names and most of the dropping bottom fold are in view. */
  --W: min(calc(100vw - 32px), 400px);
  --Hm: clamp(318px, 50vh, calc(var(--W) * 1.08));
  --Ht: clamp(110px, calc(var(--Hm) * .38), 150px);
  --Hb: calc(var(--Hm) * .72);
  --P: max(56px, calc(46vh - var(--Hm) / 2));
  --D: max(0px, calc(var(--Ht) - var(--P) + 40px));
  color-scheme:light;
}
@supports (height:100svh){
  :root{ --Hm: clamp(318px, 50svh, calc(var(--W) * 1.08)); --P: max(56px, calc(46svh - var(--Hm) / 2)); }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--shade)}
body{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink);background:var(--shade);overflow-x:clip;min-height:100vh}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Skip: first in focus order, visible until the sheet is open */
.skip{position:fixed;top:max(12px, env(safe-area-inset-top));right:12px;z-index:20;min-height:44px;padding:0 18px;border:1px solid var(--twine);border-radius:999px;
  background:var(--paper);font-size:16px;letter-spacing:.04em;cursor:pointer}
.skip[hidden]{display:none}

/* ---------- the sheet ---------- */
.sheet{position:relative;width:var(--W);margin:calc(var(--P) + var(--D) - var(--Ht)) auto 0;height:calc(var(--Ht) - var(--D) + var(--Hm));container-type:inline-size}
.sheet.is-open{height:calc(var(--Ht) + var(--Hm) + var(--Hb))}
/* a long perspective keeps the dropping fold from flaring past the screen edges */
.move{position:absolute;left:0;right:0;top:0;height:calc(var(--Ht) + var(--Hm) + var(--Hb));perspective:3200px;perspective-origin:50% 50%;
  transform:translateY(calc(var(--D) * -1));transition:transform 1100ms var(--ease-io) 300ms}
.is-open .move{transform:none}
.pnl{position:absolute;left:0;width:100%}
.mid{top:var(--Ht);height:var(--Hm)}
.mid:focus{outline:none}
.bt{top:calc(var(--Ht) + var(--Hm));height:var(--Hb);transform-origin:50% 0;transform-style:preserve-3d;
  transform:rotateX(180deg);transition:transform 1000ms var(--ease-io) 1450ms}
.tp{top:0;height:var(--Ht);transform-origin:50% 100%;transform-style:preserve-3d;
  transform:rotateX(-180deg);transition:transform 1100ms var(--ease-io) 300ms}
.is-open .bt,.is-open .tp{transform:none}
.face-in,.face-out{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face-out{transform:rotateX(180deg)}
.paper-bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.paper-bg rect{fill:var(--paper);filter:url(#paper-soft)}
.mid > .paper-bg{filter:var(--sun)}
.bt .face-in > .paper-bg{filter:var(--sun)}
.face-out > .paper-bg{filter:drop-shadow(0 1.5px 1.2px rgb(59 47 37 / .16)) drop-shadow(0 5px 6px rgb(59 47 37 / .07))}
/* the bottom fold's outer face shows a soft fold shadow along its free edge, so the second fold reads as a fold */
.bt .face-out::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(rgb(59 47 37 / .10),rgb(59 47 37 / 0))}
.crease{position:absolute;left:3%;right:3%;top:0;height:1px;background:rgb(184 148 106 / .42)}
.instant,.instant *{transition:none !important}

/* blind emboss on the outer face of the top fold, to the right, clear of the painted sprig */
.emboss{position:absolute;left:58%;width:32%;top:14%;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}
.emboss .hi{stroke:#FFFDF7;stroke-width:2.4;opacity:.9;transform:translate(-1.2px,-1.2px)}
.emboss .lo{stroke:#3B2F25;stroke-width:2.4;opacity:.11;transform:translate(1.2px,1.6px)}

/* closed: twine across the packet at the seal, one olive sprig tucked under it */
.closed-deco{position:absolute;left:0;right:0;top:var(--Ht);height:var(--Hm);pointer-events:none;transition:opacity .45s ease-out}
.is-open .closed-deco{opacity:0}
.twine{position:absolute;left:-1.5%;width:103%;top:calc(var(--Ht) - 9px);height:18px;overflow:visible;fill:none;stroke:var(--twine);stroke-width:1.3;stroke-linecap:round}
/* the sprig sits on the outer face of the top fold so it multiplies into that paper; a soft mask fades out the crop's
   smudge (top left) and specks (top, right) */
.sprig{position:absolute;left:calc(50% - 100px);bottom:8px;width:82px;mix-blend-mode:multiply;rotate:-14deg;
  -webkit-mask-image:radial-gradient(ellipse 56% 58% at 56% 60%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 56% 58% at 56% 60%,#000 62%,transparent 100%)}
.seal{position:absolute;left:50%;top:calc(var(--Ht) * 2);translate:-50% -38px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5;
  padding:0 10px 4px;border:0;border-radius:14px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:opacity .35s ease-out,transform .35s ease-out}
.seal-label{font-style:italic;font-size:18px;line-height:1.2;color:var(--ink);background:var(--paper);padding:0 6px;border-radius:4px}
.wax-wrap{position:relative;width:76px;height:76px;filter:var(--sun)}
.wax-wrap svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.02)}}
.sheet:not(.is-open) .wax-wrap{animation:breathe 4s ease-in-out 1.5s 3}
.is-open .seal{opacity:0;transform:scale(.96);pointer-events:none}

/* ---------- art planes (stand-in deck crops): colour only, feathered, multiplied into the paper, kept quieter than the names ---------- */
.planes{position:absolute;inset:0;overflow:hidden}
.plane{position:absolute;mix-blend-mode:multiply}
.plane img,.plane svg{display:block;width:100%;height:auto}
.feather{-webkit-mask-image:radial-gradient(closest-side,#000 58%,transparent 100%);mask-image:radial-gradient(closest-side,#000 58%,transparent 100%)}
.p-clouds{top:calc(50% - 15.6cqw);left:10%;width:80%;--f:.04}
.p-branch{top:-16%;left:-3%;width:15%;rotate:-148deg}
.p-swallows{top:46%;right:5%;width:21%}
.sky-ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.p-hills{top:2%;left:2%;width:96%}
.p-tree{right:0;bottom:5%;width:38%}
.p-plaque{left:8%;bottom:11%;width:44%;mix-blend-mode:normal}

@keyframes washin{from{opacity:0}to{opacity:1}}
@keyframes soft{from{opacity:0}to{opacity:.82}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.js .plane{opacity:0}
.js .plane.on{animation:soft 1s var(--ease-out) var(--s,0s) both}
.js .tp .plane.on{animation-name:washin}
.js .done .plane{animation:none !important;opacity:.82}
.js .done .tp .plane{opacity:1}

/* ink lines draw with stroke-dashoffset (allowed); everything else is transform or opacity */
.ink{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
@keyframes draw{from{stroke-dashoffset:1.01}to{stroke-dashoffset:0}}
.js .drawable path{stroke-dasharray:1 2;stroke-dashoffset:1.01}
.js .go .drawable path{animation:draw var(--t,.8s) var(--ease-io) var(--d,0s) forwards}
.js .done .drawable path{animation:none;stroke-dashoffset:0}

/* ---------- the names panel ---------- */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 7% 18px;text-align:center}
.kicker{font-size:15px;font-style:italic;color:var(--brown);line-height:1.3}
.pane{position:relative;width:80%;aspect-ratio:412/212;margin:14px 0 0;container-type:inline-size}
.pane > img{position:absolute;inset:0;width:100%;height:100%}
/* the names, written by hand on the glaze; plain text for screen readers in .vh */
.names{position:absolute;left:9%;right:7%;top:12%;margin:0;font-family:var(--script);font-weight:400;color:var(--olive);font-size:19.5cqw;line-height:.92;text-align:left}
.pen .l{display:block;white-space:nowrap}
.pen .amp{padding-left:26%}
.pen .amp.long{padding-left:17%}
.names.long{font-size:17.5cqw}
.pen .ch{display:inline-block}
/* Allura's T throws its top stroke over the o (red team: can read as "Tõmás"): the o steps a little to the right */
.pen .ch.after-t{margin-left:.13em}
.weeds{position:absolute;left:-13.11%;top:-18.87%;width:126.21%;height:141.51%;overflow:visible;pointer-events:none}
/* weeds in a soft brown ink, lighter than the names */
.weeds .ink{stroke:var(--brown);stroke-opacity:.82}
.weeds .det{stroke:var(--brown);stroke-linecap:round;stroke-linejoin:round}
.weeds .wash path{stroke:none}
/* the drifting leaf lands in the grass at the foot of the wild pea */
.fall-leaf{position:absolute;left:101%;top:103%;width:5.5%;height:auto;overflow:visible;rotate:12deg}
.fall-leaf .fw{fill:var(--sage);opacity:.75}
.fall-leaf .fl{fill:none;stroke:var(--brown);stroke-opacity:.8;stroke-linecap:round}
.when{margin-top:20px;display:flex;flex-direction:column;align-items:center}
.date{font-size:19px;font-style:italic;line-height:1.2}
.tile-ico{display:block;width:20px;height:20px;margin:8px 0 6px}
.place{font-size:23px;line-height:1.15;letter-spacing:.01em;color:var(--warm-ink)}
.village{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brown);margin-top:3px;padding-left:.24em}

/* the names sequence, from .go (set as the bottom fold starts to drop): the kicker and the pane come in while it drops,
   then the names write, then date and place, the weeds in ink, the weeds in colour, one leaf */
.js .seq{opacity:0}
.js .go .seq{animation:appear .6s var(--ease-out) var(--d,0s) both}
.js .pane > img{opacity:0}
.js .go .pane > img{animation:washin .8s var(--ease-out) .15s both}
.js .pen .ch{opacity:0}
@keyframes pen{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.js .go .pen .ch{animation:pen .16s ease-out calc(1s + var(--i) * .085s) both}
.js .weeds .det,.js .weeds .wash,.js .weeds .shadow{opacity:0}
.js .go .weeds .det{animation:washin .35s var(--ease-out) calc(var(--d,0s) + .55s) both}
.js .go .weeds .drawable path{animation-delay:calc(var(--d,0s) + .55s)}
.js .go .weeds .wash{animation:washin .8s var(--ease-out) 5.05s both}
.js .go .weeds .shadow{animation:washin .8s var(--ease-out) 5.05s both}
.js .fall-leaf{opacity:0}
@keyframes fall{from{opacity:0;transform:translate(-14px,-150px) rotate(-70deg)}12%{opacity:1}55%{transform:translate(6px,-50px) rotate(-18deg)}to{opacity:1;transform:none}}
.js .go .fall-leaf{animation:fall 1.7s var(--ease-out) 5.85s both}
.js .done .seq,.js .done .pane > img,.js .done .pen .ch,.js .done .weeds .det,.js .done .weeds .wash,.js .done .weeds .shadow,.js .done .fall-leaf{animation:none !important;opacity:1}

/* ---------- after the sheet: prototype-only replay ---------- */
.end{width:var(--W);margin:40px auto 0;padding-bottom:max(48px, env(safe-area-inset-bottom));display:flex;justify-content:center}
.end[hidden]{display:none}
.again{min-height:44px;padding:0 18px;border:1px solid rgb(184 148 106 / .7);border-radius:999px;background:transparent;font-size:15px;color:var(--brown);cursor:pointer}

/* ---------- reduced motion: opens at once, everything fades in, no drawing, no drift, no parallax ---------- */
@media (prefers-reduced-motion:reduce){
  .move,.bt,.tp,.seal,.closed-deco{transition-duration:1ms !important;transition-delay:0s !important}
  .sheet:not(.is-open) .wax-wrap{animation:none}
  .js .plane.on,.js .go .seq,.js .go .pane > img,.js .go .pen .ch,.js .go .weeds .det,.js .go .weeds .wash,.js .go .weeds .shadow,.js .go .fall-leaf{animation:washin .6s ease-out both !important}
  .plane{transform:none !important}
  .js .drawable path{stroke-dasharray:none;stroke-dashoffset:0;animation:none !important}
}
</style>
</head>

<script>
(function(){
  var T = {
    'pt-PT': {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de abertura', join:'e', date:'10 de julho de TODO(user)', card:'Convite', again:'Fechar e ver de novo'},
    'en':    {seal:'Tap to open', skip:'Skip', kicker:'TODO(user) · opening line', join:'and', date:'10 July TODO(user)', card:'Invitation', again:'Close and replay'},
    'es':    {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de apertura', join:'y', date:'10 de julio de TODO(user)', card:'Invitación', again:'Cerrar y repetir'}
  };
  var code = (new URLSearchParams(location.search).get('lang') || 'pt-PT');
  if (!T[code]) code = 'pt-PT';
  var t = T[code];
  document.documentElement.lang = code;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t[el.getAttribute('data-i18n')]; });
  document.getElementById('card').setAttribute('aria-label', t.card);

  /* the names, split into letters for the pen; the o after the T steps out from under its top stroke */
  (function pen(join){
    var lines = ['Maya', join + ' Tomás'], i = 0, html = '';
    lines.forEach(function(line, li){
      html += '<span class="l' + (li ? ' amp' + (join.length > 1 ? ' long' : '') : '') + '">';
      line.split('').forEach(function(c, k){
        if (c === ' ') { html += ' '; return; }
        html += '<span class="ch' + (line[k - 1] === 'T' ? ' after-t' : '') + '" style="--i:' + (i++) + '">' + c + '</span>';
      });
      html += '</span>';
    });
    document.querySelector('.pen').innerHTML = html;
    if (join.length > 1) document.querySelector('.names').classList.add('long');
  })(t.join);

  var sheet = document.getElementById('sheet'), seal = document.getElementById('seal'), skip = document.getElementById('skip'),
      card = document.getElementById('card'), end = document.getElementById('end'), again = document.getElementById('again'), timers = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  /* ---- ONE sequence (times from the tap) ----
     0 seal off; 0.3 to 1.4 top fold lifts; 1.3 sky fades in and three ink birds draw; 1.45 to 2.45 bottom fold drops,
     while the opening line and the tile pane come in; names write 2.45 to 3.5; date and place 3.5 to 4.5; weeds in ink
     4.65 to 6.5; weeds in colour 6.5 to 7.3; one leaf drifts into the grass 7.3 to 9; then still.
     Land (hills, olive tree, plaque): each one as it enters the view, one at a time, never waiting on the names. */
  var SKY_AT = 1300, NAMES_AT = 1450, STEP = 1100;
  var LAND = ['p-hills', 'p-tree', 'p-plaque'], landTimer = null, landI = 0, freeAt = 0;
  function open(instant){
    if (sheet.classList.contains('is-open')) return;
    if (instant) sheet.classList.add('instant', 'done');
    sheet.classList.add('is-open');
    seal.disabled = true; skip.hidden = true; end.hidden = false;
    var fast = instant || reduce;
    later(function(){ ['p-clouds', 'p-branch', 'p-swallows'].forEach(function(c){ sheet.querySelector('.' + c).classList.add('on'); }); sheet.querySelector('.tp').classList.add('go'); }, fast ? 0 : SKY_AT);
    later(function(){ sheet.classList.add('go'); card.focus({preventScroll:true}); }, fast ? 0 : NAMES_AT);
    later(startLand, fast ? 0 : NAMES_AT + 1000);
  }
  function startLand(){
    if (reduce || sheet.classList.contains('done')) { LAND.forEach(function(c){ sheet.querySelector('.' + c).classList.add('on'); }); return; }
    landI = 0; freeAt = 0; landTimer = setInterval(checkLand, 150); checkLand();
  }
  function checkLand(){
    var now = performance.now();
    if (landI >= LAND.length) { clearInterval(landTimer); return; }
    if (now < freeAt) return;
    var el = sheet.querySelector('.' + LAND[landI]), r = el.getBoundingClientRect();
    if (r.top < innerHeight * .92 && r.bottom > 0) { el.classList.add('on'); landI++; freeAt = now + STEP; }
  }
  function close(){
    timers.forEach(clearTimeout); timers = []; clearInterval(landTimer);
    window.scrollTo(0, 0);
    sheet.classList.add('instant');
    sheet.classList.remove('is-open', 'go', 'done');
    sheet.querySelector('.tp').classList.remove('go');
    sheet.querySelectorAll('.plane').forEach(function(el){ el.classList.remove('on'); el.style.transform = ''; });
    planes.forEach(function(o){ o.last = null; });
    end.hidden = true;
    seal.disabled = false; skip.hidden = false;
    seal.focus({preventScroll:true});
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ sheet.classList.remove('instant'); }); });
  }
  seal.addEventListener('click', function(){ open(false); });
  skip.addEventListener('click', function(){ open(true); });
  again.addEventListener('click', close);
  /* decode the hidden scene images before anyone taps, so the reveal never waits on a decode */
  window.addEventListener('load', function(){
    sheet.querySelectorAll('img').forEach(function(im){ if (im.decode) im.decode().catch(function(){}); });
  });

  /* ---- light vertical parallax on the far clouds only (transform; off under reduced motion) ---- */
  var ticking = false;
  var planes = Array.prototype.map.call(sheet.querySelectorAll('.plane'), function(el){
    return {el: el, f: parseFloat(getComputedStyle(el).getPropertyValue('--f')) || 0, last: null};
  }).filter(function(o){ return o.f !== 0; });
  function par(){
    ticking = false;
    if (!sheet.classList.contains('is-open')) return;
    var vh = window.innerHeight;
    planes.forEach(function(o){
      var r = o.el.parentNode.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      var p = Math.max(-420, Math.min(420, r.top + r.height / 2 - vh / 2));
      var y = Math.round(p * o.f * 2) / 2;
      if (y !== o.last) { o.el.style.transform = y ? 'translateY(' + y + 'px)' : ''; o.last = y; }
    });
  }
  if (!reduce) window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(par); } }, {passive:true});

  /* keep every ink line at its CSS px weight whatever the SVG scale */
  var inks = document.querySelectorAll('[data-px]');
  function fit(){
    inks.forEach(function(g){
      var sv = g.ownerSVGElement || g, w = sv.getBoundingClientRect().width, vb = sv.viewBox.baseVal.width;
      if (w && vb) g.style.strokeWidth = (parseFloat(g.getAttribute('data-px')) * vb / w).toFixed(3);
    });
    var wd = document.querySelector('.weeds'), ww = wd.getBoundingClientRect().width;
    if (ww) document.querySelectorAll('.weeds .det').forEach(function(d){ d.style.strokeWidth = (.7 * 520 / ww).toFixed(3); });
  }
  fit();
  if ('ResizeObserver' in window) { var ro = new ResizeObserver(fit); ro.observe(sheet); } else window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
