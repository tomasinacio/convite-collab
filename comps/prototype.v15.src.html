:root{
  --paper:#F6EFDF; --sand:#E6D6B8; --ink:#3B2F25; --olive:#4F5F2E; --terracotta:#9A4C32;
  --brown:#6B4F34; --twine:#B8946A; --clay:#C98B6B; --lemon:#EBDDA0;
  --shade:#E3E2D6; --warm-ink:#4A3B2E;

  --az-ink:#1B2556; --az-cobalt:#344680; --az-glaze:#F3EEE5;
  --script:'Allura', cursive;
  --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
  /* one curve family [AN][EM]: ease-out for entrances, the house ease-in-out for hinges and on-screen travel (CC 1.8),
     a near-linear glaze for light and pigment (CC 4.8: light and opacity changes take linear) */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-fold:cubic-bezier(.77,0,.175,1); --ease-glaze:cubic-bezier(.33,.1,.5,1);
  --ease-sine:cubic-bezier(.37,0,.63,1);   /* v13: every ambient loop, infinite alternate (easeInOutSine) */
  /* brown shadows, one light top left, 1:2 offsets (CC 1.5, 1.6, 6.4) */
  --lie:0 1px 1.5px rgb(107 79 52 / .2), 1px 2px 4px rgb(107 79 52 / .07), 2px 4px 8px rgb(107 79 52 / .06), 4px 8px 16px rgb(107 79 52 / .06), 8px 16px 32px rgb(107 79 52 / .05);
  /* sheet geometry (opening round 2): S one screen; W sheet width; one tall sheet from the width: Hm middle, Ht top flap,
     Hb bottom flap, whose free edges meet under the seal; P where the closed packet sits (centred); top where the open
     sheet sits (68 px down, clear of Skip); D slides the closed packet to P */
  --S:100vh;
  /* v15: full-bleed. The closed packet (the middle panel under its two flaps) is the screen; the top flap hinges on the
     screen's top edge, the bottom flap on its bottom edge; the seam and the seal sit a third of the way down */
  --W:100vw;
  --Hm:var(--S);
  --Ht:calc(var(--S) * .34);
  --Hb:calc(var(--Hm) - var(--Ht));
  --P:0px;                          /* the packet's top: the screen's top */
  --top:calc(var(--Ht) * -1);       /* the sheet starts one flap above the screen, so the middle panel is the screen */
  --D:0px;                          /* nothing slides */
  --sy:calc(var(--Ht) * 2);   /* the seal sits on the top flap's free edge */
  --seal:100px;               /* seal image box (the wax is about 80 px); any seal that keeps the v9_bake.py contract fits */
  --hh:.63;                   /* seal half height over --seal */
  --k:1;                      /* face layout scale; ?sharp=1 sets 3 (see .face) */
  /* opening beats, ms from the tap: press and crack snappy, the two fold turns calm, top first then bottom */
  /* the bottom flap starts as the top one passes upright, so the lower seal half is never left alone on bare paper */
  --t-lift:160ms; --d-lift:1300ms; --t-drop:840ms; --d-drop:1360ms;   /* fully open at 2.2 s */
  --ease-io:cubic-bezier(.45,.05,.25,1);   /* the v9 fold curve */
  /* world geometry: u = 1% of the painted column (phone width, capped at 440 px); y0 = the names panel's bottom edge.
     Screen 1 hangs from S; everything below hangs from y0 in u, so every overlap holds on every phone. */
  --u:calc(min(100vw, 440px) / 100);
  --panel-top:calc(var(--S) * .41);
  --y0:calc(var(--panel-top) + var(--u) * 50.42);
  --world-h:calc(var(--y0) + var(--u) * 372);   /* v14: the dogs stand bigger on the paper below the gate, the foot under them */
  --G:calc(var(--y0) + var(--u) * 158);         /* v13: the gate-box top (was y0 + 176u) */

/* =============== THE SHEET (opening round 2, from prototype.v9.html): closed letter, wax seal, two vertical folds =============== */
/* ms from the tap: 0-100 press; 0 the whole seal swaps to two halves (the crack), they part 1 px in 180 ms; 60-420 twine ends
   slip and drop as the twine and label fade; 160-1460 top flap lifts with the sheet sliding to its open place; 840-2200 bottom
   flap drops; fully open at 2.2 s. Hand-over (v11): the world comes up 1.7-2.5 s, while the bottom flap is about 70% down,
   and the sheet dissolves 2.2-2.9 s. */
.sheet{position:relative;z-index:2;width:var(--W);margin:var(--top) auto 0;height:calc(var(--Ht) + var(--Hm) + var(--Hb))}
.sheet.is-open{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s linear 2.2s, visibility 0s linear 2.9s}
.move{position:absolute;left:0;right:0;top:0;height:100%;transform:translateY(var(--D));transition:transform var(--d-lift) var(--ease-io) var(--t-lift)}
.is-open .move{transform:none}
/* the folds sit in their own box: 1600 px perspective reads as paper, and the box clips them to the sheet's width */
.folds{position:absolute;inset:0;perspective:1600px;perspective-origin:50% calc(var(--Ht) + var(--S) / 2);overflow-x:clip}   /* v15: the eye at the screen's centre */
.pnl{position:absolute;left:0;width:100%}
/* paper faces seen at the hand-over carry the world's paper tile in the world's phase, so the dissolve shows no step */
.mid{top:var(--Ht);height:var(--Hm);background-position:calc((var(--W) - 100vw) / 2) calc((var(--top) + var(--Ht)) * -1);overflow:hidden;isolation:isolate}
/* v14: the letter holds the hero. A copy of the names block (opening line, the azulejo panel with the live names, the date
   and place) is printed on the middle of the sheet in the world's own coordinates, so it is in place as the folds open and
   the dissolve hands over to the identical block under it: no empty sky, no pop */
.print{position:absolute;left:calc((var(--W) - var(--u) * 100) / 2);top:calc((var(--top) + var(--Ht)) * -1);width:calc(var(--u) * 100);height:var(--S);pointer-events:none}
/* v15 (critic 1): .mid isolates its stacking, so nothing printed on it can paint over the closed flaps; the print is there from
   load (no raster at the tap). The date block is not printed: it arrives in the world only after the folds (item 1) */
.print .when{display:none}
/* v15: the middle face also carries the world's sky and wash (the old flap sky, now on the panel that is the screen), so the
   opened letter is the painting and the dissolve into the world shows no step */
.mid-sky{--wx:calc((var(--W) - 100vw) / 2);--wy:calc((var(--top) + var(--Ht)) * -1);position:absolute;inset:0;overflow:hidden;pointer-events:none;

    radial-gradient(90% 45% at 0% 0%, rgb(235 221 160 / .22), rgb(235 221 160 / 0) 70%) var(--wx) var(--wy) / 100vw var(--world-h) no-repeat,
    linear-gradient(rgb(151 170 189 / .10), rgb(151 170 189 / 0) calc(var(--S) * .55), rgb(230 214 184 / 0) 50%, rgb(230 214 184 / .2)) var(--wx) var(--wy) / 100vw var(--world-h) no-repeat}
.mid-sky i{position:absolute;left:calc((var(--W) - var(--u) * 100) / 2 - var(--u) * 14);top:calc((var(--top) + var(--Ht)) * -1 - var(--u) * 8);
  width:calc(var(--u) * 124);aspect-ratio:1100/733;background:var(--img-sky-b) 0 0 / 100% 100% no-repeat;transform:scaleX(-1);opacity:.2}
.tp{top:0;height:var(--Ht);transform-origin:50% 100%;transform-style:preserve-3d;transform:rotateX(-180deg);transition:transform var(--d-lift) var(--ease-io) var(--t-lift)}
.bt{top:calc(var(--Ht) + var(--Hm));height:var(--Hb);transform-origin:50% 0;transform-style:preserve-3d;transform:rotateX(180deg);
  transition:transform var(--d-drop) var(--ease-io) var(--t-drop)}

/* each face is laid out at --k times its size and scaled back. Chromium rasterises a layer turning in perspective at one texel
   per CSS px (pixelated while it moves on a DPR 3 phone); --k:3 fixes that but cost frames in CPU-throttled emulation, so 1
   is the default and ?sharp=1 tries 3 on a real phone. Lengths inside a face are times --k. */

.face-out{transform:translateY(calc(100% / var(--k))) rotateX(180deg) scale(calc(1 / var(--k))) translateZ(.3px)}

.bt:not(.ride) .face-out{background:var(--img-closed-bottom) 50% 0 / cover no-repeat}

/* the flap's sky is the world sky, cut to the flap: same file, same size, same offset, so the hand-over is seamless.
   The open flap sits at (sheet left, --top) on the page; the world's sky at (stage left - 8u, -3u). */
/* v11: it also carries the world's wash and its second, paler cloud run (.sky-b at .2), in the world's own geometry, so the
   two skies match when the world comes up around the sheet */
.flap-sky{--wx:calc((var(--W) - 100vw) / 2 * var(--k));--wy:calc(var(--top) * -1 * var(--k));position:absolute;inset:0;overflow:hidden;
  background:
    var(--img-sky) calc(((var(--W) - var(--u) * 100) / 2 - var(--u) * 8) * var(--k)) calc((var(--top) * -1 - var(--u) * 3) * var(--k)) / calc(var(--u) * 116 * var(--k)) auto no-repeat,
    radial-gradient(90% 45% at 0% 0%, rgb(235 221 160 / .22), rgb(235 221 160 / 0) 70%) var(--wx) var(--wy) / calc(100vw * var(--k)) calc(var(--world-h) * var(--k)) no-repeat,
    linear-gradient(rgb(151 170 189 / .10), rgb(151 170 189 / 0) calc(var(--S) * .55 * var(--k)), rgb(230 214 184 / 0) 50%, rgb(230 214 184 / .2)) var(--wx) var(--wy) / calc(100vw * var(--k)) calc(var(--world-h) * var(--k)) no-repeat}
.flap-sky i{position:absolute;left:calc(((var(--W) - var(--u) * 100) / 2 - var(--u) * 14) * var(--k));top:calc((var(--top) * -1 - var(--u) * 8) * var(--k));
  width:calc(var(--u) * 124 * var(--k));aspect-ratio:1100/733;background:var(--img-sky-b) 0 0 / 100% 100% no-repeat;transform:scaleX(-1);opacity:.2}

/* resting shadows on the table, one light top left: static, the fold ones fade in as each flap lands (opacity only) */
.ground{position:absolute;left:0;right:0;box-shadow:var(--lie)}
.g-mid{top:var(--Ht);height:var(--Hm)}
.g-top{top:3px;height:calc(var(--Ht) - 3px);opacity:0}
.g-bot{top:calc(var(--Ht) + var(--Hm));height:calc(var(--Hb) - 3px);opacity:0}
.is-open .g-top{opacity:1;transition:opacity 300ms var(--ease-out) calc(var(--t-lift) + var(--d-lift) * .7)}
.is-open .g-bot{opacity:1;transition:opacity 250ms var(--ease-out) calc(var(--t-drop) + var(--d-drop) * .7)}
/* a flap's free edge casts a thin shadow on the paper under it */
.cast{position:absolute;left:0;right:0;height:calc(10px * var(--k))}
.tp .cast{top:calc(100% - 1px * var(--k));background:linear-gradient(rgb(107 79 52 / .2),rgb(107 79 52 / 0))}
.bt .cast{bottom:calc(100% - 3px * var(--k));background:linear-gradient(rgb(107 79 52 / 0),rgb(107 79 52 / .14))}
/* live shading: one gradient layer per face, opacity only; hinge shadow on the middle */
.shade{position:absolute;inset:0;opacity:0;pointer-events:none}
.tp .face-in .shade{background:linear-gradient(to top,rgb(59 47 37),rgb(59 47 37 / .4))}
.tp .face-out .shade{background:linear-gradient(to bottom,rgb(59 47 37),rgb(59 47 37 / .4))}
.bt .face-in .shade{background:linear-gradient(to bottom,rgb(59 47 37),rgb(59 47 37 / .4))}
.bt .face-out .shade{background:linear-gradient(to top,rgb(59 47 37),rgb(59 47 37 / .4))}
@keyframes fold-shade{0%{opacity:0}50%{opacity:.14}100%{opacity:0}}
@keyframes hinge{0%{opacity:0}40%{opacity:.2}100%{opacity:0}}
.is-open .tp .shade{animation:fold-shade var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .bt .shade{animation:fold-shade var(--d-drop) var(--ease-io) var(--t-drop) both}
.hinge{position:absolute;left:0;right:0;height:26px;opacity:0;pointer-events:none}
.h-top{top:0;background:linear-gradient(rgb(59 47 37),rgb(59 47 37 / 0))}
.h-bot{bottom:0;background:linear-gradient(rgb(59 47 37 / 0),rgb(59 47 37))}
.is-open .h-top{animation:hinge var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .h-bot{animation:hinge var(--d-drop) var(--ease-io) var(--t-drop) both}
/* a soft sheen crosses each face as it turns: paper catching the window light, not a flat board */
.gl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gl i{position:absolute;left:0;right:0;top:0;height:60%;opacity:0;transform:translateY(-100%);
  background:linear-gradient(rgb(255 252 242 / 0),rgb(255 252 242 / .38) 50%,rgb(255 252 242 / 0))}
@keyframes sheen{0%{opacity:0;transform:translateY(-100%)}40%{opacity:1}100%{opacity:0;transform:translateY(170%)}}
.is-open .tp .gl i{animation:sheen var(--d-lift) var(--ease-io) var(--t-lift) both}
.is-open .bt .gl i{animation:sheen var(--d-drop) var(--ease-io) var(--t-drop) both}

/* the user's twine and pressed sprig (P3), in two halves: at the crack each loses the part under the wax at once (so nothing
   lies over the halves), then its cut end slips out and drops a few px as it fades */
.closed-deco{position:absolute;left:0;width:100%;aspect-ratio:1083/540;top:calc(var(--sy) - var(--W) * .2493);pointer-events:none}
.deco{position:absolute;inset:0;background:var(--img-closed-deco) 0 0 / 100% 100% no-repeat}
.deco-l{clip-path:inset(0 50% 0 0);transform-origin:0 50%}
.deco-r{clip-path:inset(0 0 0 50%);transform-origin:100% 50%}
.crack .deco{opacity:0;transition:opacity .36s var(--ease-out) .06s,transform .38s var(--ease-out)}
.crack .deco-l{clip-path:inset(0 calc(50% + var(--seal) * .52) 0 0);transform:translateX(-4px) rotate(1.4deg)}
.crack .deco-r{clip-path:inset(0 0 0 calc(50% + var(--seal) * .52));transform:translateX(4px) rotate(-1.2deg)}
/* idle light: one pre-rendered band, <= .12 alpha, 3 s, every 7 s, from 2.5 s; gone on touch (CC 6.8) [CH] attention loop */
.light{position:absolute;left:0;right:0;top:var(--Ht);height:var(--Hm);overflow:hidden;pointer-events:none;z-index:6}
.light i{position:absolute;top:0;bottom:0;left:0;width:55%;opacity:0;
  background:linear-gradient(105deg, rgb(255 251 240 / 0) 20%, rgb(255 251 240 / .12) 50%, rgb(255 251 240 / 0) 80%)}
.light.on i{animation:sweep 7s linear infinite}
@keyframes sweep{0%{opacity:1;transform:translateX(-100%)}43%{opacity:1;transform:translateX(190%)}43.1%,100%{opacity:0;transform:translateX(190%)}}
.is-open .light{display:none}
/* the seal: the only call to act, a real button, 44 px+ target, label below, no pulse (CC 6.10); press scale .97 in 100 ms [EM] */
.seal{position:absolute;left:50%;top:calc(var(--sy) - var(--seal) / 2);translate:-50% 0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0 10px 4px;border:0;border-radius:14px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seal:disabled{cursor:default;pointer-events:none}
.wax{display:block;width:var(--seal);height:var(--seal);background:var(--img-seal) 0 0 / 100% 100% no-repeat;transition:scale .1s var(--ease-out)}
.seal:active .wax,.pressed .wax{scale:.97}
.seal-label{font-style:italic;font-size:18px;line-height:1.2;color:var(--ink);padding:0 6px;margin-top:calc(var(--seal) * -.05)}
.crack .wax{opacity:0}
.crack .seal-label{opacity:0;transition:opacity 200ms var(--ease-out)}
/* the halves, cut from the same photo, sit exactly under it; the tap swaps them in (the crack) and they part. They ride
   copies of the two flaps drawn above both papers, so wax that crosses the seam is never covered by the other flap.
   The upper half lifts 1 px and tips .4deg about the right end of the break; under it the lower half carries the dark
   inside of the break, so the hairline gap never shows paper. */
.half{--s:calc(var(--seal) * var(--k));position:absolute;left:calc(50% - var(--s) / 2);width:var(--s);height:calc(var(--s) * var(--hh));display:block;
  opacity:0;transform:scale(.97);background:0 0 / 100% 100% no-repeat}
.half-up{background-image:var(--img-seal-top);top:calc(100% - var(--s) / 2);transform-origin:50% calc(var(--s) / 2)}
.half-lo{background-image:var(--img-seal-bottom);top:calc((var(--Ht) - var(--Hm) + var(--Hb)) * var(--k) + var(--s) * (.5 - var(--hh)));
  transform-origin:50% calc(var(--s) * (var(--hh) - .5))}
.crack .half{opacity:1}
.crack .half-up{transform:translate(calc(var(--s) * .38),calc(-1px * var(--k))) rotate(-.4deg) translateX(calc(var(--s) * -.38));transition:transform 180ms var(--ease-out)}
.crack .half-lo{transform:none;transition:transform 180ms var(--ease-out)}

/* =============== THE WORLD: one full-bleed painted page (IR B.1 to B.9) =============== */
/* one continuous wash under everything (IR B.2): sky tint at the top, haze, straw ground at the foot; one warm light from
   the top left (IR B.4). 0 KB: gradients over the one paper tile. */
.world{position:absolute;left:0;top:0;width:100%;height:var(--world-h);z-index:1;overflow:hidden;
  background:
    radial-gradient(90% 45% at 0% 0%, rgb(235 221 160 / .22), rgb(235 221 160 / 0) 70%),
    linear-gradient(rgb(151 170 189 / .10), rgb(151 170 189 / 0) calc(var(--S) * .55), rgb(230 214 184 / 0) 50%, rgb(230 214 184 / .2)),
    var(--paper) var(--img-paper) 0 0 / 341px repeat}
.js .world{opacity:0}
.opened .world{opacity:1;transition:opacity 0s linear 1.9s}   /* v15: under the full-screen sheet; switched, not faded */
/* the painted column: phone width, centred on wider screens; its art bleeds past it */
.stage{position:absolute;top:0;bottom:0;left:50%;width:calc(var(--u) * 100);margin-left:calc(var(--u) * -50)}
.art{position:absolute;display:block;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
/* grass roots dissolve into the ground over the last ~20% (painted edges fade, IR B.6): one static gradient mask, never animated */
.root-fade{-webkit-mask-image:linear-gradient(to top, transparent, #000 22%);mask-image:linear-gradient(to top, transparent, #000 22%)}

/* ---- screen 1 (v13): every piece that loops on two rhythms is a box (one loop) holding an image .in (the other loop) ---- */
.in{position:absolute;inset:0;display:block;background-size:100% 100%;background-repeat:no-repeat}
.sky{left:calc(var(--u) * -8);top:calc(var(--u) * -3);width:calc(var(--u) * 116);aspect-ratio:1100/733}
.sky > .in{background-image:var(--img-sky)}
.sky-b-wrap{position:absolute;left:calc(var(--u) * -14);top:calc(var(--u) * -8);width:calc(var(--u) * 124);aspect-ratio:1100/733;opacity:.2}
.sky-b{left:0;top:0;width:100%;height:100%;background-image:var(--img-sky-b);transform:scaleX(-1)}
/* two cloud veils (C1 far, C2 low behind the panel). Until the Copilot clouds arrive they are cut from sky-b's warm cloud
   masses under a soft, static elliptical mask (the adviser's fallback) */
.c1{left:calc(var(--u) * 26);top:calc(var(--u) * 2);width:calc(var(--u) * 48);aspect-ratio:3/1;opacity:.55}
/* C2 starts right of 74u: further left, the round cloud's ink outline sat behind the opening line (3.1:1, measured) */
.c2{left:calc(var(--u) * 74);top:calc(var(--panel-top) - var(--u) * 22);width:calc(var(--u) * 56);aspect-ratio:3/1;opacity:.6}
.c1 > .in,.c2 > .in{background-image:var(--img-sky-b);
  -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent);mask-image:radial-gradient(closest-side, #000 30%, transparent)}
.c1 > .in{background-size:250% auto;background-position:8.3% 10%}
.c2 > .in{background-size:263% auto;background-position:100% 17.3%;transform:scaleX(-1)}
[data-art~="cloud-long"] .c1{aspect-ratio:600/280}
[data-art~="cloud-round"] .c2{aspect-ratio:600/283}
[data-art~="cloud-long"] .c1 > .in{background:var(--img-cloud-long) 0 0 / 100% 100% no-repeat;-webkit-mask-image:none;mask-image:none}
[data-art~="cloud-round"] .c2 > .in{background:var(--img-cloud-round) 0 0 / 100% 100% no-repeat;-webkit-mask-image:none;mask-image:none;transform:none}
/* the olive twice: B (the same art turned 38deg) behind A, so the corner reads as one tree, not one sticker */
/* v14 wipes: each wiped piece is a box one fifth longer than its image on the side it grows towards, with a static mask that
   fades that extra fifth; the box slides in from the cut end while the image inside counter-slides by the same distance, so
   the picture stays still and a soft painted edge sweeps across it. Transforms only: nothing repaints (--wk = box / image). */
.olive{left:calc(var(--u) * -7);top:calc(var(--u) * -3);width:calc(var(--u) * 69.6);aspect-ratio:1320/1098;transform-origin:0 0;--wk:1.2;
  -webkit-mask-image:linear-gradient(90deg, #000 83.3%, transparent);mask-image:linear-gradient(90deg, #000 83.3%, transparent)}
.olive > .in{right:16.67%;background-image:var(--img-olive);transform-origin:35% 30%}
.olive-b{left:calc(var(--u) * -4);top:calc(var(--u) * -6);width:calc(var(--u) * 36);aspect-ratio:1100/1098;transform-origin:0 0;transform:rotate(38deg)}
.olive-b > .in{background-image:var(--img-olive);transform-origin:0 0}
/* with the new art, olive B is a long twig hanging straight down at the left edge, behind the olive, its cut end at the
   top; its lower half shows below the olive's leaves (further right it was hidden by them) */
[data-art~="olive-twig-trailing"] .olive-b{left:calc(var(--u) * .5);top:calc(var(--u) * -2);width:calc(var(--u) * 12);aspect-ratio:102/432;
  transform:none;transform-origin:50% 0;--wk:1.2;-webkit-mask-image:linear-gradient(#000 83.3%, transparent);mask-image:linear-gradient(#000 83.3%, transparent)}
[data-art~="olive-twig-trailing"] .olive-b > .in{bottom:16.67%;background-image:var(--img-olive-twig);transform-origin:50% 0}
/* the orange branch (lane C's art and box: left 54u, top -3.5u, 48u wide, cut end at 97.6% 5.2%, turned 2deg), the olive's
   mirror: it grows in from the right edge with the same soft-edged wipe (box a fifth wider to the left, image counter-slides) */
.citrus{left:calc(var(--u) * 44.4);top:calc(var(--u) * -3.5);width:calc(var(--u) * 57.6);aspect-ratio:912/537;transform-origin:81.3% 5.2%;rotate:2deg;--wk:1.2;
  -webkit-mask-image:linear-gradient(270deg, #000 83.3%, transparent);mask-image:linear-gradient(270deg, #000 83.3%, transparent)}
.citrus > .in{left:16.67%;background-image:var(--img-citrus);transform-origin:97.6% 5.2%}
/* v14 falling leaf (comps/art/perf/falling-leaf-research.txt): it falls at a constant speed (linear, a leaf at terminal
   velocity), sways sideways on a sine (4.6 s), turns about +-30deg on another period that lags the sway (3.4 s), and tips in
   3D on a third (5.3 s); it fades in under the olive and out into the grass; one fall of 10 s every 50 s, from 8 s. Each
   fall varies a little (start and sway width, set by the script). Three nested boxes, transforms and opacity only. */
.leaf-fall{display:none;left:calc(var(--u) * 4.5);top:calc(var(--u) * 12);width:calc(var(--u) * 3.4);aspect-ratio:46/120;opacity:0;
  --fall:calc(var(--y0) - var(--u) * 42);--sa:3}
[data-art~="olive-leaf"] .leaf-fall{display:block}
.leaf-sway{position:absolute;inset:0;perspective:300px}
.leaf-sway > i{position:absolute;inset:0;display:block;background:var(--img-olive-leaf) 0 0 / 100% 100% no-repeat;transform-origin:50% 20%}
@keyframes leaf-fall{0%{opacity:0;transform:translateY(0)}3%{opacity:1}17%{opacity:1}20%{opacity:0;transform:translateY(var(--fall))}
  20.01%,100%{opacity:0;transform:translateY(0)}}
@keyframes leaf-x{from{translate:calc(var(--u) * var(--sa) * -1) 0}to{translate:calc(var(--u) * var(--sa)) 0}}
@keyframes leaf-r{from{rotate:-30deg}to{rotate:30deg}}
@keyframes leaf-flip{from{transform:rotateX(-25deg)}to{transform:rotateX(35deg)}}
.js .go .leaf-fall{animation:leaf-fall 50s linear 8s infinite}
.js .go .leaf-sway{animation:leaf-x 2.3s var(--ease-sine) 7.5s infinite alternate both}
.js .go .leaf-sway > i{animation:leaf-r 1.7s var(--ease-sine) 7.5s infinite alternate both, leaf-flip 2.65s var(--ease-sine) 7.5s infinite alternate both}
.bird{aspect-ratio:1100/799;background-image:var(--img-swallow)}
/* v14: t1 sat on the olive's leaves; it flies in open sky, clear of every branch, cloud edge and word */
.bird.t1{left:calc(var(--u) * 64);top:calc(var(--panel-top) - var(--u) * 21);width:calc(var(--u) * 8.5);rotate:-6deg}
.bird.t2{left:calc(var(--u) * 55);top:calc(var(--S) * .23);width:calc(var(--u) * 5);rotate:10deg}
/* the two birds over the land: a box drifts sideways, the bird inside rises, falls and tilts on another rhythm */
.soar{aspect-ratio:1100/799}
.soar.s3{left:calc(var(--u) * 58);top:calc(var(--y0) + var(--u) * 105);width:calc(var(--u) * 5.5)}
.soar.s4{left:calc(var(--u) * 66);top:calc(var(--y0) + var(--u) * 109);width:calc(var(--u) * 3.6)}
.soar > .in{background-image:var(--img-swallow);transform:scaleX(-1)}
.bird.t5{left:calc(var(--u) * 24);top:calc(var(--y0) + var(--u) * 146);width:calc(var(--u) * 5);rotate:-8deg}
/* a second pose (seen from below) for some of the small birds, so five swallows are not one sticker */
[data-art~="swallow-below"] .bird.t2,[data-art~="swallow-below"] .bird.t5{background-image:var(--img-swallow-below);aspect-ratio:195/200}
[data-art~="swallow-below"] .soar.s4{aspect-ratio:195/200}
[data-art~="swallow-below"] .soar.s4 > .in{background-image:var(--img-swallow-below)}

.names-block{position:absolute;inset:0 0 auto;height:var(--S)}
.names-block:focus{outline:none}
.kicker{position:absolute;left:0;right:0;top:calc(var(--panel-top) - 34px);text-align:center;font-size:15px;font-style:italic;color:var(--brown);line-height:1.3}
/* the azulejo panel: 6 tiles, ~306 x 198 at 393 px (AZ), contact shadow lower right (one light) */
.panel{position:absolute;left:calc(var(--u) * 11);top:var(--panel-top);width:calc(var(--u) * 78);aspect-ratio:1100/711;container-type:inline-size;
  background:var(--img-names-panel) 0 0 / 100% 100% no-repeat;box-shadow:1px 2px 2px rgb(107 79 52 / .2), 3px 6px 14px rgb(107 79 52 / .1)}
/* names: serif capitals in the cartouche's clear centre, MAYA / e / TOMÁS like CASA / da / HORTA (AZ) */
.names{position:absolute;left:15%;right:15%;top:22%;bottom:24%;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-family:var(--serif);font-weight:600;color:var(--az-ink);font-size:11.2cqw;line-height:1;letter-spacing:.04em;text-align:center}
.pen .l{display:block;white-space:nowrap}
.pen .l.cap{text-transform:uppercase}
.pen .l.join{font-style:italic;font-weight:400;font-size:.9em;letter-spacing:0;line-height:.85;margin:.02em 0 .04em}
.pen .ch{display:inline-block}
/* the meadow round the panel: grass behind it (mirrored copies), the near grass and blooms in front */
.bgrass-l{left:calc(var(--u) * -2);top:calc(var(--y0) - var(--u) * 50);width:calc(var(--u) * 20);aspect-ratio:468/700;background-image:var(--img-grass-a);
  transform-origin:50% 100%;scale:-1 1}
.bgrass-r{left:calc(var(--u) * 82);top:calc(var(--y0) - var(--u) * 56);width:calc(var(--u) * 20);aspect-ratio:567/850;transform-origin:50% 100%;scale:-1 1}
.bgrass-r > .in{background-image:var(--img-grass-b);transform-origin:50% 100%}
/* the near grass and the lavender rise from the ground: wiped bottom up (boxes a fifth taller, soft top edge) */
.grass-l{left:calc(var(--u) * 1);top:calc(var(--y0) + 26px - var(--u) * 39.58);width:calc(var(--u) * 22);aspect-ratio:468/840;transform-origin:50% 100%;--wk:1.2;
  -webkit-mask-image:linear-gradient(0deg, #000 83.3%, transparent);mask-image:linear-gradient(0deg, #000 83.3%, transparent)}
.grass-l > .in{top:16.67%;background-image:var(--img-grass-a);transform-origin:50% 100%}
.grass-r{left:calc(var(--u) * 76);top:calc(var(--y0) + 38px - var(--u) * 54);width:calc(var(--u) * 30);aspect-ratio:567/1020;transform-origin:50% 100%;--wk:1.2;
  -webkit-mask-image:linear-gradient(0deg, #000 83.3%, transparent);mask-image:linear-gradient(0deg, #000 83.3%, transparent)}
.grass-r > .in{top:16.67%;background-image:var(--img-grass-b);transform-origin:50% 100%}
/* with the new art, Portuguese lavender stands behind the panel's right edge in place of the mirrored grass */
[data-art~="lavender"] .bgrass-r{aspect-ratio:179/480;scale:1 1;width:calc(var(--u) * 18);top:calc(var(--y0) - var(--u) * 66.04);--wk:1.2;
  -webkit-mask-image:linear-gradient(0deg, #000 83.3%, transparent);mask-image:linear-gradient(0deg, #000 83.3%, transparent)}
[data-art~="lavender"] .bgrass-r > .in{top:16.67%;background-image:var(--img-lavender)}
.bloom{left:calc(var(--u) * 74);top:calc(var(--y0) - var(--u) * 15);width:calc(var(--u) * 28);aspect-ratio:1064/1100;background-image:var(--img-bloom);transform-origin:40% 80%}
.bloom-l{left:0;top:calc(var(--y0) - var(--u) * 8);width:calc(var(--u) * 16);aspect-ratio:1064/1100;background-image:var(--img-bloom);transform-origin:40% 80%;scale:-1 1}
/* NEW ART slots: the wildflower strip at the panel's foot (two pieces, centre medallion clear) and the dogs' paws; bindweed at
   the panel's lower right and the plaque's lower right. Hidden until their files arrive (data-art flags from the build) */
.strip,.bind{display:none}
[data-art~="meadow-strip"] .strip,[data-art~="bindweed"] .bind{display:block}
/* each piece shows the whole strip (400 x 152), the right one mirrored so it is not read as a copy */
.strip{aspect-ratio:400/152;background:var(--img-meadow-strip) 0 0 / 100% 100% no-repeat;transform-origin:50% 100%;
  /* the straight cut and both ends melt into the ground: two static gradients, intersected (never animated) */
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(#000 60%, transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(#000 60%, transparent);

/* v15 (critic 4): the art is inlined as data: URIs inside the --img-* custom properties. Chrome re-parses a var()
   value on every style recalc of every element that uses it, so each class change (the tap, `go`) re-read megabytes
   of base64: 180 to 390 ms stalls at CPU 4x. blobArt() swaps each painted-world data: URI for a short blob: URL once,
   while the closed letter waits (called from the load idle callback), so those recalcs become cheap. The poster's
   own art (the closed faces, twine, whole seal) keeps its data: URIs, so it never repaints. Every rule stays as written; no JS: data: URIs. */
function blobArt(){ var st = document.querySelector('style'); if (!st || !window.Blob || !window.URL || !URL.createObjectURL || !window.atob) return;
  var css = st.textContent;
  try { st.textContent = css.replace(/data:(image\/[\w+.-]+);base64,([A-Za-z0-9+\/=]+)/g, function(m, t, b, at){
    if (/--img-(closed-[\w-]+|seal)\s*:\s*url\("?$/.test(css.slice(Math.max(0, at - 48), at))) return m;
    var u; if (Uint8Array.fromBase64) u = Uint8Array.fromBase64(b); else { var s = atob(b), n = s.length; u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = s.charCodeAt(i); }
    return URL.createObjectURL(new Blob([u], {type: t})); }); } catch (e) {} }
</script>
</head>
<body>

<button type="button" class="skip" id="skip" data-i18n="skip">Saltar</button>

<main class="page" id="page">
  <!-- the world: one painted page under the sheet; it becomes visible as the sheet opens -->
  <div class="world" id="world">
    <div class="stage">
      <i class="art sky amb"><i class="in amb"></i></i>

      <i class="art olive-b go-art amb"><i class="in amb"></i></i>

      <i class="art citrus go-art amb"><i class="in amb"></i></i>

      <section class="names-block" id="names" tabindex="-1" aria-label="Convite">
        <p class="kicker" data-i18n="kicker">TODO(user) · frase de abertura</p>
        <div class="panel">
          <i class="glint" aria-hidden="true"><i></i></i>
          <h1 class="names"><span class="vh"><span translate="no">Maya</span> <span data-i18n="join">e</span> <span translate="no">Tomás</span></span><span class="pen" aria-hidden="true"></span></h1>
        </div>
        <div class="when">
          <p class="date" data-i18n="date">10 de julho de 2027</p>
          <p class="place" lang="pt-PT" translate="no">Quinta do Grilo</p>
          <p class="village" lang="pt-PT" translate="no">Milharado</p>
        </div>
      </section>
      <i class="art grass-l go-art amb"><i class="in root-fade amb"></i></i>
      <i class="art bloom go-art amb"></i>
      <i class="art grass-r go-art amb"><i class="in root-fade amb"></i></i>
      <i class="art bloom-l go-art amb"></i>

      <i class="art root-fade grass-l2 amb"></i><i class="art root-fade grass-r2 amb"></i>

      <section class="gate-box" aria-label="Quinta do Grilo">

      <!-- the user's four dogs; decorative here. TODO(user): a line of copy if they should be announced -->

  <div class="sheet" id="sheet">
    <div class="move">
      <div class="ground g-mid" aria-hidden="true"></div>
      <div class="ground g-top" aria-hidden="true"></div>
      <div class="ground g-bot" aria-hidden="true"></div>
      <div class="pnl mid paper" aria-hidden="true"><div class="mid-sky"><i></i></div><div class="print" id="print"></div><span class="crease"></span><span class="hinge h-top"></span><span class="hinge h-bot"></span></div>
      <div class="folds">
        <div class="pnl bt" id="bt" aria-hidden="true">
          <div class="face face-in paper"><span class="crease"></span><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <div class="pnl tp" aria-hidden="true">
          <div class="face face-in paper"><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <!-- the seal halves ride copies of the two flaps (same box, origin, transform and timing), above both papers -->
        <div class="pnl bt ride" aria-hidden="true"><div class="face face-out"><i class="half half-lo"></i></div></div>
        <div class="pnl tp ride" aria-hidden="true"><div class="face face-out"><i class="half half-up"></i></div></div>
      </div>
      <div class="closed-deco" aria-hidden="true"><i class="deco deco-l"></i><i class="deco deco-r"></i></div>

        <span class="wax" aria-hidden="true"></span>
        <span class="seal-label" data-i18n="seal">Toca para abrir</span>
      </button>
    </div>
  </div>
</main>

<script>
(function(){
  var T = {
    'pt-PT': {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de abertura', join:'e', date:'10 de julho de 2027', card:'Convite', again:'Fechar e ver de novo'},
    'en':    {seal:'Tap to open', skip:'Skip', kicker:'TODO(user) · opening line', join:'and', date:'10 July 2027', card:'Invitation', again:'Close and replay'},
    'es':    {seal:'Toca para abrir', skip:'Saltar', kicker:'TODO(user) · frase de apertura', join:'y', date:'10 de julio de 2027', card:'Invitación', again:'Cerrar y repetir'}
  };
  var code = new URLSearchParams(location.search).get('lang') || 'pt-PT';
  if (!T[code]) code = 'pt-PT';
  var t = T[code];
  document.documentElement.lang = code;
  if (new URLSearchParams(location.search).get('sharp') === '1') document.documentElement.classList.add('sharp');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t[el.getAttribute('data-i18n')]; });

  var $ = function(s, r){ return (r || document).querySelector(s); }, $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var page = $('#page'), sheet = $('#sheet'), seal = $('#seal'), skip = $('#skip'), names = $('#names'), light = $('#light');
  names.setAttribute('aria-label', t.card);
  var liteMotion = document.documentElement.classList.contains('lite-motion');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  /* the names, one span per letter: MAYA / e / TOMÁS (capitals by CSS, the copy stays as written) */
  $('.pen').innerHTML = ['Maya', t.join, 'Tomás'].map(function(line, li){
    return '<span class="l ' + (li === 1 ? 'join' : 'cap') + '">' + line.split('').map(function(c){
      return c === ' ' ? ' ' : '<span class="ch">' + c + '</span>';
    }).join('') + '</span>';
  }).join('');

  /* v14: the hero printed inside the letter (see .print): a copy of the names block, hidden from assistive technology */
  (function(){
    var c = names.cloneNode(true);
    c.removeAttribute('id'); c.removeAttribute('tabindex'); c.removeAttribute('aria-label');
    c.querySelectorAll('.glint, .vh').forEach(function(n){ n.remove(); });
    c.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
    $('#print').appendChild(c);
  })();

  /* ---- the timeline, seconds from the tap [CH] one lead at a time; full table in V10-NOTES.md ----
     0 to .10 press; 0 the seal cracks, .06 to .42 twine and label go; .16 to 1.46 top fold + sheet; 1.04 to 2.20 bottom fold;
     1.70 to 2.50 the world comes up under the sheet (margins turn to paper, the sky widens); 2.20 to 2.90 the sheet dissolves;
     2.40 panel glaze; 2.55 opening line; 2.85 to 3.85 names by glyph advance (lift between lines); 3.95/4.07/4.15 date,
     place, village (uneven gaps, no metronome); 4.30 to 5.60 olive from its corner; 4.90/5.10 two tiny swallows; 5.40 left
     grass; 5.80 right grass; 6.30 bloom; 6.80 to 8.80 mist hills and land glaze together; 8.20 to 10.30 one swallow crosses;
     Skip fades at 10.0 on the animation clock; from 10.5 ambient only (cloud drift, a glint at 11.5 s, sway from 13 s, a rare
     bird every ~52 s from 18 s), continuous by the user's choice. */
  var NAMES_AT = 2.85, NAMES_END = 3.85, LIFT = .12;
  function timeNames(){
    var lines = $$('.pen .l'), total = 0, ws = [];
    lines.forEach(function(l){ $$('.ch', l).forEach(function(c){ var w = c.getBoundingClientRect().width || 10; ws.push(w); total += w; }); });
    var span = NAMES_END - NAMES_AT - .16 - LIFT * (lines.length - 1), x = 0, i = 0;
    lines.forEach(function(l, li){
      $$('.ch', l).forEach(function(c){
        c.style.setProperty('--d', (NAMES_AT + x / total * span + li * LIFT).toFixed(3) + 's');
        x += ws[i++];
      });
    });
  }

  /* ---- before the tap: measure the names once the fonts are in, and decode the screen-1 art while the letter waits,
     so the tap frame does no layout read and no image decode (the folds keep 60 fps) [AN] animation-performance ---- */
  var timed = false;
  function timeOnce(){ if (!timed) { timed = true; timeNames(); } }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(timeOnce);
  function warm(){ document.documentElement.classList.add('warm'); }
  /* frame-time probe: if the closed letter cannot hold 50 fps for 600 ms, take the lighter motion tier */
  if (!/[?&]motion=/.test(location.search) && !document.documentElement.classList.contains('lite-motion') && window.requestAnimationFrame) {
    addEventListener('load', function(){
      var f = [], t0 = 0;
      (function tick(t){ if (!t0) t0 = t; f.push(t); if (t - t0 < 600 && !page.classList.contains('opened')) requestAnimationFrame(tick); else {
        var g = []; for (var i = 1; i < f.length; i++) g.push(f[i] - f[i - 1]); g.sort(function(a, b){ return a - b; });
        if (g.length > 5 && g[Math.floor(g.length / 2)] > 20) document.documentElement.classList.add('lite-motion');
      } })(0);
    });
  }
  addEventListener('load', function(){
    warm();   // the letter (the poster) is up: now fetch the painted art while the guest looks at it
    (window.requestIdleCallback || setTimeout)(function(){
      if (!page.classList.contains('opened')) blobArt();   // v15: before the decode pass below (it decodes the blob: URLs); never mid-opening
      /* v15 (critic 4): the observers (lazy art one screen ahead, the names leaving, the dogs, the loops in view) are made now,
         while the letter waits, so their first callbacks and the near art's decode happen before the tap */
      watch(); ambObserve();
      /* the seal halves and the flaps' faces too: they first show at the tap */
      $$('.world .art:not([data-lazy]), .world .in:not([data-lazy]), .sheet .half, .sheet .face, .mid-sky, .mid-sky i').forEach(function(el){
        var m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);
        if (m) { var im = new Image(); im.src = m[1]; if (im.decode) im.decode().catch(function(){}); }
      });
    });
  });

  /* ---- closed: the idle light from 2.5 s, stopped for good by the first touch or focus (CC 6.8) ---- */
  var lightT = reduce ? 0 : setTimeout(function(){ light.classList.add('on'); }, 2500);
  function stopLight(){ clearTimeout(lightT); light.classList.remove('on'); }
  document.addEventListener('pointerdown', stopLight, {once:true});
  seal.addEventListener('pointerdown', function(){ seal.classList.add('pressed'); });
  seal.addEventListener('focus', stopLight);

  /* ---- finishing: what still runs ends within 300 ms (Skip; the names block leaving the view, CC 4.11, 4.12).
     The ambient (cloud drift, the rare bird) is left alone: it is slow by design and never part of the reveal. ---- */
  /* the ambient: never hurried, paused while out of view */
  var AMBIENT = /^(drift|cross-rare|sweep|gust|sway|sw\d|leaf|glint|settle|breath|wag|tail|bob|soar)/;
  function hurry(anims){
    anims.forEach(function(a){
      if (AMBIENT.test(a.animationName || '')) return;
      var tg = a.effect && a.effect.target;
      if (tg && tg.closest && tg.closest('.dogs')) return;   /* the dogs come in when they are seen, not on the reveal clock */
      var ct = a.effect && a.effect.getComputedTiming(), left = ct ? ct.endTime - (a.currentTime || 0) : 0;
      if (isFinite(left) && left > 300) a.updatePlaybackRate(left / 300);
    });
  }

  /* ---- lower scenes: their image is applied one screen before they come into view (first load stays small) ---- */
  var near = null, leave = null, seenDogs = null, dogs = $('#dogs');
  function watch(){
    var lazies = $$('[data-lazy]');
    if (!('IntersectionObserver' in window)) { lazies.forEach(function(el){ el.classList.add('near'); }); return; }
    near = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('near'); near.unobserve(e.target); } }); }, {rootMargin:'100% 0px 100% 0px'});
    lazies.forEach(function(el){ near.observe(el); });
    leave = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.intersectionRatio < .05) hurry(page.getAnimations({subtree:true})); }); }, {threshold:[0, .05]});
    leave.observe(names);
    /* the dogs come in when a third of the group is in view */
    seenDogs = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('seen'); seenDogs.unobserve(e.target); } }); }, {threshold:.3});
    seenDogs.observe(dogs);
  }

  /* ---- open ---- */
  function open(){
    if (sheet.classList.contains('is-open')) return;
    stopLight(); seal.classList.add('pressed'); warm();
    page.classList.add('opened'); sheet.classList.add('is-open', 'crack');
    /* v15 (critic 4): the press and the crack own the tap frame; the reveal's ~120 animations are created two frames later */
    if (reduce) page.classList.add('go');
    else requestAnimationFrame(function(){ requestAnimationFrame(function(){ page.classList.add('go'); }); });
    timeOnce();
    seal.disabled = true;
    if (reduce) { sheet.classList.add('instant'); finish(true); return; }
    later(function(){ names.focus({preventScroll:true}); }, 3200);
    later(sweep, 7200);   /* after the reveal: pause the loops of every piece that is out of view */
    /* Skip leaves on the animation clock, not a timer, so it always matches the reveal it skips (a timer let it leave
       early whenever the animation clock ran slower than the wall clock, as in slowed captures): v14: held to 6.9 s, out by 7.0 s, as the reveal ends */
    skipExit = skip.animate([{opacity:1}, {opacity:1, offset:.98}, {opacity:0}], {duration:7000, fill:'forwards'});
    skipExit.finished.then(function(){ skip.classList.add('out'); skip.hidden = true; skipExit.cancel(); skipExit = null; }, function(){});
  }
  var skipExit = null;
  function finish(now){
    if (skipExit) { skipExit.cancel(); skipExit = null; }
    if (!sheet.classList.contains('is-open')) { sheet.classList.add('instant'); open(); }
    hurry(document.getAnimations());
    if (!near) watch();
    swept = false;    names.focus({preventScroll:true});
    timers.forEach(clearTimeout); timers = [];
    skip.classList.add('out');
    setTimeout(function(){ skip.hidden = true; }, now ? 0 : 300);
    setTimeout(sweep, 400);
  }

  /* ---- ambient control: each ambient animation runs only while its element is in view (battery) ---- */
  var seen = new Map(), amb = null, AMB_SEL = '.amb, .glint, .dogs';
  /* v15 (critic 4): no checkpoints, no forced style flushes during the reveal. The loops start themselves from rest when their
     piece lands (CSS delays); the lite tier's loops all start at 7 s (CSS). One IntersectionObserver, made while the letter
     waits, records what is in view; after the reveal (7.2 s, or Skip) a single sweep pauses the loops of pieces out of view,
     and from then on only a change of view pauses or resumes a piece. */
  function apply(el){
    var out = seen.get(el) === false;
    el.getAnimations({subtree:true}).forEach(function(a){
      if (!AMBIENT.test(a.animationName || '')) return;
      if (out) { if (a.playState === 'running') a.pause(); }
      else if (a.playState === 'paused') a.play();
    });
  }
  var swept = false;
  function sweep(){ swept = true; seen.forEach(function(v, el){ if (v === false) apply(el); }); }
  function ambObserve(){
    if (reduce || amb || !('IntersectionObserver' in window)) return;
    amb = new IntersectionObserver(function(es){ es.forEach(function(e){
      var was = seen.get(e.target); seen.set(e.target, e.isIntersecting);
      if (swept && was !== e.isIntersecting) apply(e.target);
    }); });
    $$(AMB_SEL).forEach(function(el){ amb.observe(el); });
  }
  /* the falling leaf varies a little at every fall: where it starts and how wide it sways */
  var leaf = $('#leaf');
  if (leaf) leaf.addEventListener('animationiteration', function(e){
    if (e.animationName !== 'leaf-fall') return;
    leaf.style.left = 'calc(var(--u) * ' + (3.5 + Math.random() * 2).toFixed(2) + ')';
    leaf.style.setProperty('--sa', (2.2 + Math.random() * 1.4).toFixed(2));
  });
  seal.addEventListener('click', function(){ open(); });
  skip.addEventListener('click', function(){ finish(false); });

  /* prototype only: close and replay */
  $('#again').addEventListener('click', function(){
    timers.forEach(clearTimeout); timers = [];
    dogs.classList.remove('seen');
    if (seenDogs) seenDogs.observe(dogs);
    window.scrollTo(0, 0);
    sheet.classList.add('instant');
    sheet.classList.remove('is-open', 'crack'); page.classList.remove('opened', 'go');
    seal.classList.remove('pressed'); seal.disabled = false;
    skip.hidden = false; skip.classList.remove('out');
    if (skipExit) { skipExit.cancel(); skipExit = null; }
    seal.focus({preventScroll:true});
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ sheet.classList.remove('instant'); }); });
  });
})();
</script>
</body>
