<body>

<button type="button" class="skip" id="skip" data-i18n="skip">Saltar</button>

<main class="page" id="page">
  <!-- the world: one painted page under the sheet; it becomes visible as the sheet opens -->
  <div class="world" id="world">
    <div class="stage">
      <i class="art sky amb"><i class="in amb"></i></i>
      <div class="sky-b-wrap amb"><i class="art sky-b amb"></i></div>
      <i class="art c1 go-art amb"><i class="in amb"></i></i>
      <i class="art mist"></i>
      <i class="art land"></i>
      <i class="art olive-b go-art amb"><i class="in amb"></i></i>
      <i class="art olive go-art amb"><i class="in amb"></i></i>
      <i class="art leaf-fall amb" id="leaf"><i class="leaf-sway"><i></i></i></i>
      <i class="art bird t1 go-art"></i><i class="art bird t2 go-art"></i>
      <i class="art citrus go-art amb"><i class="in amb"></i></i>
      <i class="art c2 go-art amb"><i class="in amb"></i></i>
      <i class="art root-fade bgrass-l go-art amb"></i><i class="art bgrass-r go-art amb"><i class="in root-fade amb"></i></i>

      <section class="names-block" id="names" tabindex="-1" aria-label="Convite">
        <p class="kicker" data-i18n="kicker">TODO(user) · frase de abertura</p>
        <div class="panel">
          <i class="glint" aria-hidden="true"><i></i></i>
          <h1 class="names"><span class="vh"><span translate="no">Maya</span> <span data-i18n="join">e</span> <span translate="no">Tomás</span></span><span class="pen" aria-hidden="true"></span></h1>
        </div>
        <div class="when">
          <p class="date" data-i18n="date">10 de julho de 2027</p>
          <p class="place" lang="pt-PT" translate="no">Quinta do Grilo</p>
          <p class="village" lang="pt-PT" translate="no">Milharado</p>
        </div>
      </section>
      <i class="art grass-l go-art amb"><i class="in root-fade amb"></i></i>
      <i class="art bloom go-art amb"></i>
      <i class="art grass-r go-art amb"><i class="in root-fade amb"></i></i>
      <i class="art bloom-l go-art amb"></i>
      <i class="art strip s1 go-art"></i><i class="art strip s2 go-art"></i>
      <i class="art bind b1 go-art"></i>

      <i class="art root-fade grass-l2 amb"></i><i class="art root-fade grass-r2 amb"></i>
      <i class="art soar s3 amb"><i class="in amb"></i></i><i class="art soar s4 amb"><i class="in amb"></i></i>

      <section class="gate-box" aria-label="Quinta do Grilo">
        <i class="art gate lazy" data-lazy></i>
        <p class="plaque-text" lang="pt-PT" translate="no"><span class="q">Quinta</span><span class="g"><span class="do">do</span> Grilo</span></p>
      </section>
      <i class="art vine lazy amb" data-lazy></i>
      <i class="art euca amb"><i class="in euca-i amb" data-lazy></i></i>
      <i class="art root-fade grass-p amb"></i>
      <i class="art bind b2"></i>
      <!-- the user's four dogs; decorative here. TODO(user): a line of copy if they should be announced -->
      <div class="dogs" id="dogs" aria-hidden="true">
        <i class="dog dg-tuft root-fade t-l"></i><i class="dog dg-tuft root-fade t-r"></i>
        <span class="dog d-tan"><i class="d-tan-i" data-lazy></i></span>
        <span class="dog d-collie"><i class="d-collie-i" data-lazy></i></span>
        <span class="dog d-merle"><i class="d-merle-i" data-lazy></i><i class="d-tail" data-lazy></i></span>
        <span class="dog d-golden"><i class="d-golden-i" data-lazy></i></span>
        <i class="dog dg-posy"></i>
      </div>
      <i class="art strip s3"></i><i class="art strip s4"></i>
      <i class="art bird t5"></i>
      <i class="art grass-f1 amb"></i><i class="art grass-f2 amb"></i>
      <div class="foot">
        <p class="village" lang="pt-PT" translate="no">Milharado</p>
        <p class="date" data-i18n="date">10 de julho de 2027</p>
        <button type="button" class="again" id="again" data-i18n="again">Fechar e ver de novo</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="move">
      <div class="ground g-mid" aria-hidden="true"></div>
      <div class="ground g-top" aria-hidden="true"></div>
      <div class="ground g-bot" aria-hidden="true"></div>
      <div class="pnl mid paper" aria-hidden="true"><div class="mid-sky"><i></i></div><div class="print" id="print"></div><span class="crease"></span><span class="hinge h-top"></span><span class="hinge h-bot"></span></div>
      <div class="folds">
        <div class="pnl bt" id="bt" aria-hidden="true">
          <div class="face face-in paper"><span class="crease"></span><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <div class="pnl tp" aria-hidden="true">
          <div class="face face-in paper"><span class="gl"><i></i></span><span class="shade"></span></div>
          <div class="face face-out"><span class="cast"></span><span class="gl"><i></i></span><span class="shade"></span></div>
        </div>
        <!-- the seal halves ride copies of the two flaps (same box, origin, transform and timing), above both papers -->
        <div class="pnl bt ride" aria-hidden="true"><div class="face face-out"><i class="half half-lo"></i></div></div>
        <div class="pnl tp ride" aria-hidden="true"><div class="face face-out"><i class="half half-up"></i></div></div>
      </div>
      <div class="closed-deco" aria-hidden="true"><i class="deco deco-l"></i><i class="deco deco-r"></i></div>
      <div class="light" id="light" aria-hidden="true"><i></i></div>
      <button type="button" class="seal" id="seal">
        <span class="wax" aria-hidden="true"></span>
        <span class="seal-label" data-i18n="seal">Toca para abrir</span>
      </button>
    </div>
  </div>
</main>
